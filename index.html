01", "night": 1, "front": "Autotroph", "back": "A producer. Makes its own food from a nonliving energy source (sunlight or chemicals). Examples: plants, algae, some bacteria."}, {"id": "f1-02", "night": 1, "front": "Heterotroph", "back": "A consumer. Gets energy from living or once-living organisms. Examples: animals, most bacteria, fungi."}, {"id": "f1-03", "night": 1, "front": "Ultimate source of energy for most life", "back": "The sun."}, {"id": "f1-04", "night": 1, "front": "Photosynthesis vs. chemosynthesis", "back": "Photosynthesis: energy from sunlight (plants, cyanobacteria). Chemosynthesis: energy from chemicals like sulfur and methane (deep-sea vent bacteria). Both use nonliving sources."}, {"id": "f1-05", "night": 1, "front": "Herbivore", "back": "Eats only plants."}, {"id": "f1-06", "night": 1, "front": "Carnivore", "back": "Eats only meat (other animals)."}, {"id": "f1-07", "night": 1, "front": "Omnivore", "back": "Eats both plants and meat."}, {"id": "f1-08", "night": 1, "front": "Detritivore", "back": "Also called a decomposer. Eats dead materials."}, {"id": "f1-09", "night": 1, "front": "Food chain", "back": "Traces a single flow of energy and shows the trophic levels."}, {"id": "f1-10", "night": 1, "front": "Food web", "back": "Shows multiple food chains at once and how they interconnect."}, {"id": "f1-11", "night": 1, "front": "Which way do the arrows point?", "back": "From the food to the eater, the way the energy flows."}, {"id": "f1-12", "night": 1, "front": "The four trophic levels", "back": "1 producer · 2 primary consumer · 3 secondary consumer · 4 tertiary consumer."}, {"id": "f1-13", "night": 1, "front": "Rule of 10", "back": "Only about 10% of the energy passes to the next level. The other 90% is used for metabolism or lost as heat."}, {"id": "f1-14", "night": 1, "front": "Energy pyramid", "back": "Shows the energy available at each trophic level. Always gets smaller going up."}, {"id": "f1-15", "night": 1, "front": "Numbers pyramid", "back": "Shows the number of organisms at each level. Energy decreases going up, so fewer organisms can be supported."}, {"id": "f1-16", "night": 1, "front": "Biomass pyramid", "back": "Shows the total mass of living organic matter at each level."}, {"id": "f1-17", "night": 1, "front": "Percent of energy at levels 1-4", "back": "100% · 10% · 1% · 0.1%."}, {"id": "f2-01", "night": 2, "front": "Photosynthesis (what it does)", "back": "Turns sunlight, water and carbon dioxide into chemical energy stored in glucose."}, {"id": "f2-02", "night": 2, "front": "Photosynthesis equation", "back": "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (solar energy by the arrow)."}, {"id": "f2-03", "night": 2, "front": "Reactants of photosynthesis", "back": "CO₂ and H₂O (the ingredients)."}, {"id": "f2-04", "night": 2, "front": "Products of photosynthesis", "back": "C₆H₁₂O₆ (glucose) and O₂ (the results)."}, {"id": "f2-05", "night": 2, "front": "Is sunlight a reactant?", "back": "No. It's needed, but it isn't a reactant or a product."}, {"id": "f2-06", "night": 2, "front": "How water and CO₂ get into a plant", "back": "Water through the roots. CO₂ through the stomata (openings in the leaves)."}, {"id": "f2-07", "night": 2, "front": "Grana", "back": "Pancake-like stacks of thylakoid membrane. Where the light-dependent reaction happens."}, {"id": "f2-08", "night": 2, "front": "Stroma", "back": "The fluid-like substance that fills the space between the grana. Where the Calvin cycle happens."}, {"id": "f2-09", "night": 2, "front": "Chlorophyll", "back": "The green pigment that captures sunlight. Stored in the thylakoid membrane."}, {"id": "f2-10", "night": 2, "front": "Light-dependent reaction", "back": "Stage 1. Grana (thylakoid membrane). Uses sunlight and water. Makes ATP, NADPH and oxygen (a waste product)."}, {"id": "f2-11", "night": 2, "front": "Calvin cycle", "back": "Stage 2, the light-independent reaction. Stroma. Uses CO₂, ATP and NADPH. Makes glucose."}, {"id": "f2-12", "night": 2, "front": "Energy carriers made in stage 1", "back": "ATP and NADPH. They move into the stroma to power the Calvin cycle."}, {"id": "f2-13", "night": 2, "front": "What happens to water in stage 1?", "back": "It's split into hydrogen and oxygen. The oxygen is released as a waste product."}, {"id": "f2-14", "night": 2, "front": "Endothermic", "back": "Takes in energy. Photosynthesis is endothermic."}, {"id": "f3-01", "night": 3, "front": "Goal of cellular respiration", "back": "Turn the chemical energy in food (glucose) into chemical energy stored in ATP."}, {"id": "f3-02", "night": 3, "front": "Cellular respiration equation", "back": "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP)."}, {"id": "f3-03", "night": 3, "front": "Reactants and products of respiration", "back": "Reactants: glucose and O₂. Products: CO₂ and H₂O. (ATP is released but isn't counted as a product.)"}, {"id": "f3-04", "night": 3, "front": "Inner membrane", "back": "The folded membranes of the mitochondria. Where the electron transport chain is."}, {"id": "f3-05", "night": 3, "front": "Matrix", "back": "The fluid-like substance that fills the mitochondria. Where the Krebs cycle happens."}, {"id": "f3-06", "night": 3, "front": "Glycolysis", "back": "First stage. Splits glucose (6 carbons) into 2 pyruvate (3 carbons each). Cytoplasm. No oxygen needed (anaerobic). Makes 2 ATP and 2 NADH."}, {"id": "f3-07", "night": 3, "front": "Decision time", "back": "After glycolysis: oxygen present → aerobic respiration. No oxygen → anaerobic respiration (fermentation)."}, {"id": "f3-08", "night": 3, "front": "Krebs cycle", "back": "Also called the citric acid cycle. Matrix. Uses pyruvate. Makes 2 ATP, some NADH and FADH₂, and releases CO₂."}, {"id": "f3-09", "night": 3, "front": "Electron transport chain (respiration)", "back": "Inner membrane. Uses the electrons and hydrogens from the Krebs cycle, plus oxygen. Makes 34 ATP and water. Most ATP comes from here."}, {"id": "f3-10", "night": 3, "front": "Aerobic ATP total", "back": "36-38 ATP: 2 glycolysis + 2 Krebs + 34 ETC."}, {"id": "f3-11", "night": 3, "front": "Anaerobic ATP total", "back": "2-4 ATP: 2 glycolysis + 2 fermentation."}, {"id": "f3-12", "night": 3, "front": "Lactic acid fermentation", "back": "Some bacteria and animal cells (like muscles). Pyruvate → lactic acid + 2 ATP."}, {"id": "f3-13", "night": 3, "front": "Alcohol fermentation", "back": "Yeast, when there's no oxygen. Pyruvate → alcohol + CO₂ + 2 ATP."}, {"id": "f3-14", "night": 3, "front": "Exothermic", "back": "Gives off energy. Cellular respiration is exothermic."}, {"id": "f3-15", "night": 3, "front": "NADH vs. NADPH", "back": "NADH (and FADH₂): cellular respiration. NADPH (with a P): photosynthesis."}, {"id": "f4-01", "night": 4, "front": "How the two processes connect", "back": "Photosynthesis makes C₆H₁₂O₆ + O₂. Respiration uses them and makes CO₂ + H₂O, which photosynthesis uses again."}, {"id": "f4-02", "night": 4, "front": "Chloroplast vs. mitochondria", "back": "Chloroplast: photosynthesis (grana + stroma). Mitochondria: cellular respiration (inner membrane + matrix)."}, {"id": "f4-03", "night": 4, "front": "Step 1 and Step 2 of photosynthesis", "back": "1: light-dependent reaction (grana). 2: Calvin cycle / light-independent reaction (stroma)."}, {"id": "f4-04", "night": 4, "front": "Step 1 and Step 2 of aerobic respiration", "back": "1: Krebs (citric acid) cycle (matrix). 2: electron transport chain (inner membrane). Glycolysis comes first, in the cytoplasm."}], "mc": [{"id": "m1-01", "night": 1, "q": "What is the ultimate source of energy for most life on Earth?", "choices": ["Water", "Plants", "The sun", "Glucose"], "answer": 2, "why": "Producers capture the sun's energy, and everything else gets it by eating."}, {"id": "m1-02", "night": 1, "q": "Another name for a producer is:", "choices": ["Autotroph", "Heterotroph", "Detritivore", "Omnivore"], "answer": 0, "why": "Auto means self: producers make their own food."}, {"id": "m1-03", "night": 1, "q": "Heterotrophs get their energy from:", "choices": ["Sunlight", "Chemicals like sulfur", "The soil", "Living or once-living organisms"], "answer": 3, "why": "Hetero means other: consumers eat other organisms."}, {"id": "m1-04", "night": 1, "q": "Which of these is a heterotroph?", "choices": ["Grass", "A mushroom (fungus)", "Algae", "Cyanobacteria"], "answer": 1, "why": "Fungi are consumers. Grass, algae and cyanobacteria are producers."}, {"id": "m1-05", "night": 1, "q": "Bacteria at deep-sea vents make food using:", "choices": ["Chemicals like sulfur and methane", "Sunlight", "Dead material", "Lactic acid"], "answer": 0, "why": "No sunlight reaches that deep, so they use chemosynthesis."}, {"id": "m1-06", "night": 1, "q": "What do photosynthesis and chemosynthesis have in common?", "choices": ["Both use sunlight", "Both happen only in animals", "Both use nonliving sources of energy", "Both happen in the mitochondria"], "answer": 2, "why": "Sunlight and chemicals are both nonliving sources."}, {"id": "m1-07", "night": 1, "q": "An animal that eats only plants is a(n):", "choices": ["Carnivore", "Herbivore", "Omnivore", "Detritivore"], "answer": 1, "why": "Herbivores eat only plants."}, {"id": "m1-08", "night": 1, "q": "Detritivores (decomposers) eat:", "choices": ["Only meat", "Only plants", "Sunlight", "Dead materials"], "answer": 3, "why": "They're the clean-up crew."}, {"id": "m1-09", "night": 1, "q": "A food chain shows:", "choices": ["Many connected feeding paths", "Only the producers", "How much each animal weighs", "A single flow of energy"], "answer": 3, "why": "Chain = one path. Web = many paths."}, {"id": "m1-10", "night": 1, "q": "In a food chain, each arrow points from:", "choices": ["The food to the eater", "The eater to the food", "The biggest animal to the smallest", "The top to the bottom"], "answer": 0, "why": "The arrow follows the energy, from what's eaten to what eats it."}, {"id": "m1-11", "night": 1, "q": "Grass → grasshopper → mouse. The mouse is a:", "choices": ["Producer", "Primary consumer", "Secondary consumer", "Tertiary consumer"], "answer": 2, "why": "Grass 1 (producer), grasshopper 2 (primary), mouse 3 (secondary)."}, {"id": "m1-12", "night": 1, "q": "About how much energy passes from one trophic level to the next?", "choices": ["100%", "10%", "50%", "1%"], "answer": 1, "why": "The Rule of 10."}, {"id": "m1-13", "night": 1, "q": "What happens to most (90%) of the energy at each level?", "choices": ["It's saved for the next level", "It's used for metabolism or lost as heat", "It goes back to the sun", "It turns into oxygen"], "answer": 1, "why": "Living uses energy, and some escapes as heat."}, {"id": "m1-14", "night": 1, "q": "A numbers pyramid shows:", "choices": ["The number of food chains", "The calories at each level", "The total mass of living matter", "The number of organisms at each trophic level"], "answer": 3, "why": "It's in the name: numbers."}, {"id": "m1-15", "night": 1, "q": "Why can fewer organisms live at the top of a pyramid?", "choices": ["Energy decreases going up the pyramid", "Top animals are lazier", "There's more oxygen at the bottom", "Producers eat the top animals"], "answer": 0, "why": "Less energy reaches the top, so it can support fewer organisms."}, {"id": "m1-16", "night": 1, "q": "A biomass pyramid shows:", "choices": ["The amount of sunlight", "The number of species", "The total mass of living organic matter at each level", "How fast energy moves"], "answer": 2, "why": "Bio = living, mass = mass."}, {"id": "m1-17", "night": 1, "q": "A producer has 6,000 calories. How many reach the secondary consumer?", "choices": ["60", "600", "6", "3,000"], "answer": 0, "why": "6,000 → 600 (primary) → 60 (secondary)."}, {"id": "m1-18", "night": 1, "q": "Which organism is always level 1 of a food chain?", "choices": ["Primary consumer", "Tertiary consumer", "Decomposer", "Producer"], "answer": 3, "why": "Every chain starts with a producer."}, {"id": "m1-19", "night": 1, "q": "A food web is more realistic than a food chain because it:", "choices": ["Shows only one path", "Shows multiple food chains and how they connect", "Leaves out producers", "Shows the weather"], "answer": 1, "why": "Most animals eat more than one thing."}, {"id": "m2-01", "night": 2, "q": "What are the reactants of photosynthesis?", "choices": ["CO₂ and H₂O", "C₆H₁₂O₆ and O₂", "CO₂ and O₂", "ATP and NADPH"], "answer": 0, "why": "Ingredients on the left: carbon dioxide and water."}, {"id": "m2-02", "night": 2, "q": "What are the products of photosynthesis?", "choices": ["CO₂ and H₂O", "Water and sunlight", "Glucose and oxygen", "ATP and CO₂"], "answer": 2, "why": "Results on the right: C₆H₁₂O₆ and O₂."}, {"id": "m2-03", "night": 2, "q": "Which is the equation for photosynthesis?", "choices": ["C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "6O₂ + 6H₂O → C₆H₁₂O₆ + 6CO₂", "6CO₂ + C₆H₁₂O₆ → 6H₂O + 6O₂"], "answer": 1, "why": "CO₂ and water in; glucose and oxygen out. The one that starts with glucose is cellular respiration."}, {"id": "m2-04", "night": 2, "q": "In photosynthesis, sunlight is:", "choices": ["A reactant", "A product", "Made in the Calvin cycle", "Needed, but not a reactant or product"], "answer": 3, "why": "Your notes say it's necessary but not a reactant or product."}, {"id": "m2-05", "night": 2, "q": "Carbon dioxide enters a plant through the:", "choices": ["Roots", "Flower", "Stroma", "Stomata"], "answer": 3, "why": "Stomata are tiny openings in the leaves."}, {"id": "m2-06", "night": 2, "q": "Water enters a plant through the:", "choices": ["Roots", "Stomata", "Flower", "Grana"], "answer": 0, "why": "Roots take up water."}, {"id": "m2-07", "night": 2, "q": "Grana are:", "choices": ["The fluid that fills the chloroplast", "The folds of the mitochondria", "Pancake-like stacks of thylakoid membrane", "Openings in a leaf"], "answer": 2, "why": "Stacks of pancakes = grana."}, {"id": "m2-08", "night": 2, "q": "The stroma is:", "choices": ["A stack of thylakoids", "The fluid-like substance between the grana", "The green pigment", "The outer wall of the cell"], "answer": 1, "why": "Stroma = the fluid around the stacks."}, {"id": "m2-09", "night": 2, "q": "Chlorophyll is:", "choices": ["A sugar made in the stroma", "The pigment that captures sunlight", "An energy-carrying molecule", "The fluid in the mitochondria"], "answer": 1, "why": "It's what makes plants green."}, {"id": "m2-10", "night": 2, "q": "Where does the light-dependent reaction happen?", "choices": ["The stroma", "The cytoplasm", "The mitochondria matrix", "The thylakoid membrane (grana)"], "answer": 3, "why": "It needs light, so it's where the chlorophyll is."}, {"id": "m2-11", "night": 2, "q": "What does the light-dependent reaction make that the Calvin cycle uses?", "choices": ["ATP and NADPH", "Glucose and CO₂", "Water and oxygen", "NADH and FADH₂"], "answer": 0, "why": "Stage 1 charges ATP and NADPH; stage 2 spends them."}, {"id": "m2-12", "night": 2, "q": "During the light-dependent reaction, water is split into:", "choices": ["Carbon and oxygen", "Glucose and oxygen", "Hydrogen and oxygen", "ATP and NADPH"], "answer": 2, "why": "H₂O = hydrogen + oxygen."}, {"id": "m2-13", "night": 2, "q": "The oxygen made in photosynthesis is:", "choices": ["Released as a waste product", "Used in the Calvin cycle", "Stored in the grana", "Turned into glucose"], "answer": 0, "why": "Plants release it into the air."}, {"id": "m2-14", "night": 2, "q": "Where does the Calvin cycle happen?", "choices": ["Grana", "Thylakoid membrane", "Inner membrane", "Stroma"], "answer": 3, "why": "Calvin lives in the stroma."}, {"id": "m2-15", "night": 2, "q": "The Calvin cycle combines hydrogen (from water) with what to make glucose?", "choices": ["Oxygen", "Carbon dioxide", "Nitrogen", "Chlorophyll"], "answer": 1, "why": "CO₂ in, glucose out."}, {"id": "m2-16", "night": 2, "q": "Another name for the light-independent reaction is the:", "choices": ["Calvin cycle", "Krebs cycle", "Electron transport chain", "Glycolysis"], "answer": 0, "why": "Krebs is respiration. Calvin is photosynthesis."}, {"id": "m2-17", "night": 2, "q": "Photosynthesis is endothermic. That means it:", "choices": ["Releases energy", "Needs no energy", "Takes in energy", "Happens only at night"], "answer": 2, "why": "Endo = in."}, {"id": "m2-18", "night": 2, "q": "Chemosynthesis is used by producers that:", "choices": ["Eat other organisms", "Can't do photosynthesis", "Live only in soil", "Need extra oxygen"], "answer": 1, "why": "Like deep-sea vent bacteria, where there's no sunlight."}, {"id": "m3-01", "night": 3, "q": "The goal of cellular respiration is to:", "choices": ["Make glucose from sunlight", "Split water into hydrogen and oxygen", "Release oxygen into the air", "Turn the energy in food into ATP"], "answer": 3, "why": "Food (glucose) → ATP your cells can use."}, {"id": "m3-02", "night": 3, "q": "Which is the equation for cellular respiration?", "choices": ["C₆H₁₂O₆ → 6CO₂ + 6O₂", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "C₆H₁₂O₆ + 6CO₂ → 6O₂ + 6H₂O", "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy"], "answer": 3, "why": "Glucose and oxygen in; CO₂, water and energy out."}, {"id": "m3-03", "night": 3, "q": "The reactants of cellular respiration are:", "choices": ["Glucose and oxygen", "CO₂ and H₂O", "ATP and water", "Glucose and CO₂"], "answer": 0, "why": "C₆H₁₂O₆ and O₂."}, {"id": "m3-04", "night": 3, "q": "Cellular respiration takes place in the:", "choices": ["Chloroplast", "Stomata", "Mitochondria", "Grana"], "answer": 2, "why": "Mitochondria (glycolysis, the first stage, is just outside in the cytoplasm)."}, {"id": "m3-05", "night": 3, "q": "The folded membranes inside the mitochondria are the:", "choices": ["Matrix", "Inner membrane", "Stroma", "Grana"], "answer": 1, "why": "Folds = inner membrane."}, {"id": "m3-06", "night": 3, "q": "The matrix is:", "choices": ["The folded inner membrane", "The fluid-like substance that fills the mitochondria", "A stack of thylakoids", "The outer wall of the cell"], "answer": 1, "why": "Fluid = matrix."}, {"id": "m3-07", "night": 3, "q": "Glycolysis happens in the:", "choices": ["Matrix", "Inner membrane", "Stroma", "Cytoplasm"], "answer": 3, "why": "Outside the mitochondria."}, {"id": "m3-08", "night": 3, "q": "Glycolysis splits one glucose (6 carbons) into:", "choices": ["2 pyruvate (3 carbons each)", "6 CO₂", "3 pyruvate (2 carbons each)", "2 glucose"], "answer": 0, "why": "6 = 3 + 3."}, {"id": "m3-09", "night": 3, "q": "Glycolysis is anaerobic. That means it:", "choices": ["Needs oxygen", "Makes oxygen", "Doesn't need oxygen", "Happens only in plants"], "answer": 2, "why": "An- means without."}, {"id": "m3-10", "night": 3, "q": "Glycolysis makes a net of:", "choices": ["2 ATP and 2 NADH", "34 ATP and water", "2 ATP and 2 NADPH", "36 ATP"], "answer": 0, "why": "NADH, no P. NADPH is photosynthesis."}, {"id": "m3-11", "night": 3, "q": "After glycolysis, if oxygen is present, the cell goes through:", "choices": ["Fermentation", "Chemosynthesis", "Photosynthesis", "Aerobic respiration"], "answer": 3, "why": "O₂ yes = aerobic."}, {"id": "m3-12", "night": 3, "q": "The Krebs cycle is also called the:", "choices": ["Calvin cycle", "Citric acid cycle", "Electron transport chain", "Lactic acid cycle"], "answer": 1, "why": "Krebs = citric acid cycle."}, {"id": "m3-13", "night": 3, "q": "Where does the Krebs cycle happen?", "choices": ["Mitochondria matrix", "Cytoplasm", "Inner membrane", "Stroma"], "answer": 0, "why": "Krebs in the matrix."}, {"id": "m3-14", "night": 3, "q": "What does the Krebs cycle use?", "choices": ["Glucose", "Sunlight", "Pyruvate from glycolysis", "Lactic acid"], "answer": 2, "why": "Glucose was already split in glycolysis."}, {"id": "m3-15", "night": 3, "q": "What waste gas does the Krebs cycle release?", "choices": ["O₂", "CO₂", "H₂", "N₂"], "answer": 1, "why": "CO₂ is the waste product."}, {"id": "m3-16", "night": 3, "q": "In cellular respiration, the electron transport chain is in the:", "choices": ["Matrix", "Thylakoid membrane", "Cytoplasm", "Inner membrane of the mitochondria"], "answer": 3, "why": "ETC on the folds."}, {"id": "m3-17", "night": 3, "q": "Which step makes the most ATP?", "choices": ["Glycolysis", "Krebs cycle", "Fermentation", "Electron transport chain"], "answer": 3, "why": "34 of the 36-38."}, {"id": "m3-18", "night": 3, "q": "In the ETC, water forms when hydrogen bonds to:", "choices": ["Oxygen", "Carbon", "Glucose", "Pyruvate"], "answer": 0, "why": "H + O = water."}, {"id": "m3-19", "night": 3, "q": "Lactic acid fermentation happens in:", "choices": ["Yeast", "Chloroplasts", "Some bacteria and animal cells, like muscles", "The matrix only"], "answer": 2, "why": "Yeast does alcohol fermentation."}, {"id": "m3-20", "night": 3, "q": "Alcohol fermentation in yeast makes:", "choices": ["Lactic acid and 2 ATP", "Alcohol, CO₂ and 2 ATP", "34 ATP and water", "Glucose and oxygen"], "answer": 1, "why": "Yeast: alcohol + CO₂."}, {"id": "m3-21", "night": 3, "q": "Total ATP from aerobic respiration:", "choices": ["2-4", "36-38", "18", "100"], "answer": 1, "why": "2 + 2 + 34."}, {"id": "m3-22", "night": 3, "q": "Total ATP from anaerobic respiration:", "choices": ["0", "34", "36-38", "2-4"], "answer": 3, "why": "2 from glycolysis + 2 from fermentation."}, {"id": "m3-23", "night": 3, "q": "Cellular respiration is exothermic. That means it:", "choices": ["Releases energy", "Takes in energy", "Stores light energy", "Needs sunlight"], "answer": 0, "why": "Exo = exit."}, {"id": "m4-01", "night": 4, "q": "The products of photosynthesis are the reactants of:", "choices": ["Chemosynthesis", "The Calvin cycle", "Cellular respiration", "Glycolysis only"], "answer": 2, "why": "Glucose and O₂ go into respiration."}, {"id": "m4-02", "night": 4, "q": "Which pair is correct?", "choices": ["Photosynthesis: chloroplast; respiration: mitochondria", "Photosynthesis: mitochondria; respiration: chloroplast", "Both happen in the chloroplast", "Both happen in the stroma"], "answer": 0, "why": "Chloroplasts capture light; mitochondria make ATP."}, {"id": "m4-03", "night": 4, "q": "Which process is exothermic?", "choices": ["Photosynthesis", "The light-dependent reaction", "The Calvin cycle", "Cellular respiration"], "answer": 3, "why": "Respiration releases energy."}, {"id": "m4-04", "night": 4, "q": "NADPH is an energy carrier in:", "choices": ["Cellular respiration", "Photosynthesis", "Fermentation", "The Krebs cycle"], "answer": 1, "why": "P for photosynthesis."}, {"id": "m4-05", "night": 4, "q": "In the grass-and-cow cycle, what does the cow give back to the grass?", "choices": ["CO₂ and water", "Glucose and oxygen", "Sunlight and ATP", "NADPH and ATP"], "answer": 0, "why": "The products of respiration."}, {"id": "m4-06", "night": 4, "q": "Which process makes oxygen?", "choices": ["Cellular respiration", "Fermentation", "Photosynthesis", "Glycolysis"], "answer": 2, "why": "Water is split in the light-dependent reaction."}, {"id": "m4-07", "night": 4, "q": "Which process uses oxygen?", "choices": ["Photosynthesis", "Aerobic cellular respiration", "The Calvin cycle", "Glycolysis"], "answer": 1, "why": "Oxygen is used at the end of the ETC."}, {"id": "m4-08", "night": 4, "q": "In photosynthesis, the electron transport chain is in the:", "choices": ["Cytoplasm", "Inner membrane of the mitochondria", "Matrix", "Thylakoid membrane"], "answer": 3, "why": "Photosynthesis's ETC is in the thylakoid membrane (stage 1). Respiration's is on the mitochondria's inner membrane."}, {"id": "m4-09", "night": 4, "q": "Which molecule does photosynthesis make and respiration break down?", "choices": ["CO₂", "NADH", "H₂O", "Glucose (C₆H₁₂O₆)"], "answer": 3, "why": "Glucose links the two."}], "fill": [{"id": "b1-01", "night": 1, "sentence": "Producers are also called ______.", "answer": "autotrophs", "accept": ["autotroph"], "why": "Auto = self."}, {"id": "b1-02", "night": 1, "sentence": "Consumers are also called ______.", "answer": "heterotrophs", "accept": ["heterotroph"], "why": "Hetero = other."}, {"id": "b1-03", "night": 1, "sentence": "Organisms that eat both plants and meat are ______.", "answer": "omnivores", "accept": ["omnivore"], "why": "Omni = all."}, {"id": "b1-04", "night": 1, "sentence": "Detritivores, also called ______, eat dead materials.", "answer": "decomposers", "accept": ["decomposer"], "why": "The clean-up crew."}, {"id": "b1-05", "night": 1, "sentence": "Only about ______% of the energy passes up to the next trophic level.", "answer": "10", "accept": ["ten", "10 percent", "ten percent"], "why": "The Rule of 10.", "strict": true}, {"id": "b1-06", "night": 1, "sentence": "Energy that doesn't pass up is used for metabolism or lost as ______.", "answer": "heat", "accept": [], "why": "90% is used or lost as heat."}, {"id": "b1-07", "night": 1, "sentence": "The fourth trophic level is the ______ consumer.", "answer": "tertiary", "accept": ["3rd", "third"], "why": "Producer, primary, secondary, tertiary."}, {"id": "b1-08", "night": 1, "sentence": "Food ______ show multiple food chains at once and how they interconnect.", "answer": "webs", "accept": ["web"], "why": "Chain = one path; web = many."}, {"id": "b1-09", "night": 1, "sentence": "Chemosynthesis uses ______ instead of sunlight.", "answer": "chemicals", "accept": ["chemical", "sulfur", "methane", "sulfur and methane", "chemicals like sulfur", "chemicals like sulfur and methane"], "why": "Like sulfur and methane."}, {"id": "b1-10", "night": 1, "sentence": "The second trophic level is the ______ consumer.", "answer": "primary", "accept": ["1st", "first"], "why": "The first animal after the producer."}, {"id": "b2-01", "night": 2, "sentence": "Inside a plant cell, photosynthesis happens in the ______.", "answer": "chloroplast", "accept": ["chloroplasts"], "why": "Chloroplast for photosynthesis, mitochondria for respiration."}, {"id": "b2-02", "night": 2, "sentence": "The fluid-like substance between the grana is the ______.", "answer": "stroma", "accept": [], "why": "Pancakes = grana, syrup = stroma."}, {"id": "b2-03", "night": 2, "sentence": "Grana are stacks of ______ membrane.", "answer": "thylakoid", "accept": ["thylakoids"], "why": "Thylakoids stack up into grana."}, {"id": "b2-04", "night": 2, "sentence": "______ is the green pigment that captures sunlight.", "answer": "chlorophyll", "accept": [], "why": "It sits in the thylakoid membrane."}, {"id": "b2-05", "night": 2, "sentence": "CO₂ enters a leaf through the ______.", "answer": "stomata", "accept": ["stoma", "stomates"], "why": "Tiny openings in the leaves."}, {"id": "b2-06", "night": 2, "sentence": "The light-dependent reaction stores energy in ATP and ______.", "answer": "NADPH", "accept": [], "why": "P for photosynthesis.", "strict": true}, {"id": "b2-07", "night": 2, "sentence": "The light-independent reaction is also called the ______ cycle.", "answer": "Calvin", "accept": [], "why": "Calvin cycle, in the stroma."}, {"id": "b2-08", "night": 2, "sentence": "The Calvin cycle makes ______ (C₆H₁₂O₆).", "answer": "glucose", "accept": ["sugar"], "why": "Sugar."}, {"id": "b2-09", "night": 2, "sentence": "Reactants are the ______; products are the results.", "answer": "ingredients", "accept": ["ingredient"], "why": "Reactants go in."}, {"id": "b2-10", "night": 2, "sentence": "Photosynthesis is ______ because it takes in energy.", "answer": "endothermic", "accept": [], "why": "Endo = in."}, {"id": "b2-11", "night": 2, "sentence": "Water enters a plant through the ______.", "answer": "roots", "accept": ["root"], "why": "Roots drink water."}, {"id": "b3-01", "night": 3, "sentence": "Cellular respiration turns the energy in food into ______.", "answer": "ATP", "accept": [], "why": "The energy cells can use.", "strict": true}, {"id": "b3-02", "night": 3, "sentence": "The fluid that fills the mitochondria is the ______.", "answer": "matrix", "accept": [], "why": "Fluid = matrix."}, {"id": "b3-03", "night": 3, "sentence": "Glycolysis splits glucose into 2 molecules of ______.", "answer": "pyruvate", "accept": ["pyruvic acid"], "why": "6 carbons → 3 + 3."}, {"id": "b3-04", "night": 3, "sentence": "Glycolysis happens in the ______.", "answer": "cytoplasm", "accept": [], "why": "Outside the mitochondria."}, {"id": "b3-05", "night": 3, "sentence": "Glycolysis makes a net of 2 ATP and 2 ______.", "answer": "NADH", "accept": [], "why": "No P in respiration.", "strict": true}, {"id": "b3-06", "night": 3, "sentence": "The Krebs cycle is also called the ______ cycle.", "answer": "citric acid", "accept": ["citric"], "why": "Citric acid = Krebs."}, {"id": "b3-07", "night": 3, "sentence": "The electron transport chain makes ______ ATP.", "answer": "34", "accept": ["thirty-four", "thirty four"], "why": "Most ATP comes from the ETC.", "strict": true}, {"id": "b3-08", "night": 3, "sentence": "With no oxygen, cells go through anaerobic respiration, also called ______.", "answer": "fermentation", "accept": [], "why": "Lactic acid or alcohol."}, {"id": "b3-09", "night": 3, "sentence": "In your muscles, pyruvate becomes ______ acid.", "answer": "lactic", "accept": [], "why": "Lactic acid fermentation."}, {"id": "b3-10", "night": 3, "sentence": "Respiration that needs oxygen is called ______ respiration.", "answer": "aerobic", "accept": [], "why": "Aerobic = with air (oxygen)."}, {"id": "b3-11", "night": 3, "sentence": "The electron transport chain is on the ______ membrane of the mitochondria.", "answer": "inner", "accept": [], "why": "The folds."}, {"id": "b4-01", "night": 4, "sentence": "Photosynthesis happens in the chloroplast; cellular respiration happens in the ______.", "answer": "mitochondria", "accept": ["mitochondrion"], "why": "The powerhouse."}, {"id": "b4-02", "night": 4, "sentence": "Photosynthesis takes in energy; cellular respiration ______ energy.", "answer": "releases", "accept": ["release", "gives off", "releases energy", "produces", "gives out", "gives off energy"], "why": "Endo in, exo out."}, {"id": "b4-03", "night": 4, "sentence": "The products of cellular respiration are CO₂ and ______.", "answer": "water", "accept": ["H2O", "H₂O"], "why": "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O."}], "drills": [{"id": "rule10", "type": "rule10", "title": "Rule of 10 math", "night": 1, "intro": "Fresh numbers every time. Divide by 10 going up, multiply by 10 going down. Do 6."}, {"id": "web1", "type": "web", "title": "Food web practice", "night": 1, "intro": "Use the web. Arrows point from food to eater. Some questions have more than one answer.", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 305\" role=\"img\" aria-label=\"Practice food web: grass, berry bush, rabbit, grasshopper, mouse, frog, snake, hawk\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-w1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><line x1=\"77.1\" y1=\"267.0\" x2=\"51.3\" y2=\"135.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"98.6\" y1=\"267.0\" x2=\"140.9\" y2=\"233.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"280.8\" y1=\"267.0\" x2=\"273.4\" y2=\"179.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"192.6\" y1=\"201.0\" x2=\"240.5\" y2=\"177.5\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"151.3\" y1=\"201.0\" x2=\"124.1\" y2=\"163.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"267.9\" y1=\"147.0\" x2=\"256.6\" y2=\"105.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"140.0\" y1=\"134.4\" x2=\"220.5\" y2=\"101.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"69.3\" y1=\"103.0\" x2=\"155.9\" y2=\"42.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"234.9\" y1=\"73.0\" x2=\"199.4\" y2=\"42.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><rect x=\"154.0\" y=\"12\" width=\"52\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"180\" y=\"29.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Hawk<\/text><rect x=\"224.5\" y=\"75\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"252\" y=\"92.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Snake<\/text><rect x=\"16.799999999999997\" y=\"105\" width=\"62.400000000000006\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"48\" y=\"122.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Rabbit<\/text><rect x=\"86.0\" y=\"133\" width=\"52\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"112\" y=\"150.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Frog<\/text><rect x=\"244.5\" y=\"149\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"272\" y=\"166.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Mouse<\/text><rect x=\"112.3\" y=\"203\" width=\"99.4\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"162\" y=\"220.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grasshopper<\/text><rect x=\"52.5\" y=\"269\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"80\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grass<\/text><rect x=\"236.0\" y=\"269\" width=\"92.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"282\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Berry bush<\/text><\/svg>", "items": [{"type": "number", "q": "How many food chains are in this web?", "answer": 4, "why": "Grass → rabbit → hawk; grass → grasshopper → mouse → snake → hawk; grass → grasshopper → frog → snake → hawk; berry bush → mouse → snake → hawk.", "check": "count"}, {"type": "multi", "q": "Which are producers? Pick all.", "options": ["Grass", "Berry bush", "Rabbit", "Grasshopper"], "answers": [0, 1], "why": "Producers start the chains and make their own food.", "check": "producers ct x=\"186\" y=\"262\" width=\"166\" height=\"56\" rx=\"10\" class=\"dg-box\"/><text x=\"269\" y=\"282\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">Alcohol + CO₂<\/text><text x=\"269\" y=\"298\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">yeast<\/text><text x=\"269\" y=\"312\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">+ 2 ATP<\/text><text x=\"269\" y=\"340\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">(fermentation)<\/text><rect x=\"186\" y=\"354\" width=\"166\" height=\"40\" rx=\"10\" class=\"dg-cell\"/><text x=\"269\" y=\"379\" class=\"dg-t\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">Anaerobic: 2-4 ATP<\/text><text x=\"180\" y=\"424\" class=\"dg-tm\" font-size=\"11.5\" text-anchor=\"middle\">Most ATP comes from the electron transport chain.<\/text><\/svg>"], "lookFor": ["The folds inside, labeled inner membrane", "The fluid inside, labeled matrix", "Glycolysis outside, in the cytoplasm: glucose → 2 pyruvate", "The Krebs cycle in the matrix: CO₂ out, 2 ATP", "The ETC on the inner membrane: O₂ in, water and 34 ATP out"]}, {"id": "draw-cycle", "type": "draw", "title": "Draw it: the two processes in a circle", "night": 4, "intro": "Blank paper, no peeking. Draw how photosynthesis and cellular respiration feed each other. Then check.", "svgs": ["<svg class=\"dg\" viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"Photosynthesis and cellular respiration form a cycle\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-cyw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><ellipse cx=\"78\" cy=\"120\" rx=\"64\" ry=\"40\" class=\"dg-leaf2\"/><text x=\"78\" y=\"116\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">Chloroplast<\/text><text x=\"78\" y=\"133\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">photosynthesis<\/text><ellipse cx=\"282\" cy=\"120\" rx=\"64\" ry=\"40\" class=\"dg-mito\"/><text x=\"282\" y=\"116\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">Mitochondria<\/text><text x=\"282\" y=\"133\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">cellular respiration<\/text><path d=\"M120,88 Q180,40 240,88\" class=\"dg-arrow\" marker-end=\"url(#ah-cyw)\"/><text x=\"180\" y=\"46\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">C₆H₁₂O₆ + O₂<\/text><path d=\"M240,152 Q180,200 120,152\" class=\"dg-arrow\" marker-end=\"url(#ah-cyw)\"/><text x=\"180\" y=\"206\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">CO₂ + H₂O<\/text><circle cx=\"24\" cy=\"30\" r=\"14\" class=\"dg-sun\"/><line x1=\"34.0\" y1=\"42.0\" x2=\"52.0\" y2=\"80.0\" class=\"dg-arrow\" marker-end=\"url(#ah-cyw)\"/><text x=\"48\" y=\"22\" class=\"dg-t\" font-size=\"11\" text-anchor=\"start\" font-weight=\"600\">light energy<\/text><line x1=\"330.0\" y1=\"150.0\" x2=\"344.0\" y2=\"196.0\" class=\"dg-arrow\" marker-end=\"url(#ah-cyw)\"/><text x=\"318\" y=\"222\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">ATP energy<\/text><\/svg>"], "lookFor": ["Chloroplast (photosynthesis) on one side, mitochondria (cellular respiration) on the other", "Light energy going into the chloroplast", "C₆H₁₂O₆ + O₂ going from the chloroplast to the mitochondria", "CO₂ + H₂O going back to the chloroplast", "ATP energy coming out of the mitochondria"]}], "tests": {"A": {"name": "Practice Test A", "intro": "40 points, like a real test. Take it on Night 4 without notes, then check your score. 32 points is 80%.", "sections": [{"title": "Multiple choice", "how": "Pick the best answer. 1 point each.", "items": [{"type": "mc", "q": "Which organism is an autotroph?", "choices": ["Fox", "Mushroom", "Oak tree", "Grasshopper"], "answer": 2, "why": "Trees make their own food."}, {"type": "mc", "q": "Which kind of consumer eats dead materials?", "choices": ["Detritivore", "Carnivore", "Omnivore", "Herbivore"], "answer": 0, "why": "Detritivores are decomposers."}, {"type": "mc", "q": "Why does each trophic level have less energy than the level below it?", "choices": ["Animals higher up eat less often", "Energy is destroyed when animals sleep", "Producers keep all their energy", "Only about 10% passes up; the rest is used for metabolism or lost as heat"], "answer": 3, "why": "The Rule of 10."}, {"type": "mc", "q": "Deep-sea vent bacteria are producers that use:", "choices": ["Photosynthesis", "Chemosynthesis", "Fermentation", "The Calvin cycle"], "answer": 1, "why": "Chemicals, not sunlight."}, {"type": "mc", "q": "In 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, the products are:", "choices": ["C₆H₁₂O₆ and O₂", "CO₂ and H₂O", "CO₂ and O₂", "H₂O and C₆H₁₂O₆"], "answer": 0, "why": "Products are on the right side."}, {"type": "mc", "q": "Which part of the chloroplast holds chlorophyll?", "choices": ["Stroma", "Matrix", "Thylakoid membrane", "Cytoplasm"], "answer": 2, "why": "Chlorophyll sits in the thylakoid membrane (grana)."}, {"type": "mc", "q": "The light-dependent reaction needs:", "choices": ["No sunlight", "Solar energy", "Glucose", "Lactic acid"], "answer": 1, "why": "It depends on light."}, {"type": "mc", "q": "What goes into the Calvin cycle?", "choices": ["O₂ and water only", "Chlorophyll and sunlight", "Glucose and oxygen", "CO₂ plus ATP and NADPH"], "answer": 3, "why": "CO₂ in, powered by ATP and NADPH."}, {"type": "mc", "q": "Where does glycolysis take place?", "choices": ["Mitochondria matrix", "Inner membrane", "Stroma", "Cytoplasm"], "answer": 3, "why": "Outside the mitochondria."}, {"type": "mc", "q": "What does glycolysis make when it splits glucose?", "choices": ["2 pyruvate", "6 CO₂", "Lactic acid", "Oxygen"], "answer": 0, "why": "6 carbons → 2 pyruvate with 3 carbons each."}, {"type": "mc", "q": "Which step of aerobic respiration releases CO₂ as a waste product?", "choices": ["Glycolysis", "Electron transport chain", "Krebs (citric acid) cycle", "Light-dependent reaction"], "answer": 2, "why": "Krebs: pyruvate in, CO₂ out."}, {"type": "mc", "q": "Where does most of a cell's ATP come from?", "choices": ["Glycolysis", "The electron transport chain", "The Krebs cycle", "Fermentation"], "answer": 1, "why": "34 ATP from the ETC."}, {"type": "mc", "q": "A sprinter's legs burn because the muscle cells are doing:", "choices": ["Alcohol fermentation", "Lactic acid fermentation", "Photosynthesis", "Chemosynthesis"], "answer": 1, "why": "Muscles make lactic acid without enough oxygen."}, {"type": "mc", "q": "Yeast with no oxygen makes:", "choices": ["Lactic acid and 2 ATP", "Glucose", "36 ATP", "Alcohol, CO₂ and 2 ATP"], "answer": 3, "why": "Alcohol fermentation."}, {"type": "mc", "q": "Which statement is true?", "choices": ["The products of photosynthesis are the reactants of cellular respiration", "Photosynthesis is exothermic", "Plants make glucose in the mitochondria", "Respiration uses CO₂ and makes O₂"], "answer": 0, "why": "Glucose and O₂ go from one to the other."}]}, {"title": "Fill in the blank", "how": "Write one word or number. 1 point each.", "items": [{"type": "fill", "sentence": "Producers get energy from ______ sources, like sunlight or chemicals.", "answer": "nonliving", "accept": ["non-living", "non living"], "why": "Autotrophs use nonliving sources."}, {"type": "fill", "sentence": "The feeding levels in a food chain are called ______ levels.", "answer": "trophic", "accept": [], "why": "Trophic levels."}, {"type": "fill", "sentence": "An energy pyramid always gets ______ as you go up.", "answer": "smaller", "accept": ["narrower", "less", "small"], "why": "Remember the Rule of 10."}, {"type": "fill", "sentence": "Water enters a plant through the ______.", "answer": "roots", "accept": ["root"], "why": "Roots drink water."}, {"type": "fill", "sentence": "The light-dependent reaction happens in the ______ (stacks of thylakoids).", "a "85.0\" x2=\"180.0\" y2=\"42.0\" class=\"dg-arrow\" marker-end=\"url(#ah-wA)\"/><rect x=\"152.5\" y=\"12\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"180\" y=\"29.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Heron<\/text><rect x=\"134.0\" y=\"87\" width=\"92.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"180\" y=\"104.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Small fish<\/text><rect x=\"278.8\" y=\"127\" width=\"62.400000000000006\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"310\" y=\"144.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Turtle<\/text><rect x=\"20.099999999999994\" y=\"147\" width=\"69.80000000000001\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"55\" y=\"164.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Tadpole<\/text><rect x=\"96.6\" y=\"179\" width=\"106.80000000000001\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"150\" y=\"196.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Mayfly larva<\/text><rect x=\"212.5\" y=\"202\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"240\" y=\"219.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Snail<\/text><rect x=\"67.5\" y=\"269\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"95\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Algae<\/text><rect x=\"244.0\" y=\"269\" width=\"92.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"290\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Water lily<\/text><\/svg>", "web": "A", "items": [{"type": "number", "q": "How many food chains are in this food web?", "answer": 4, "why": "Algae → tadpole → small fish → heron; algae → mayfly larva → small fish → heron; water lily → snail → turtle; water lily → turtle.", "check": "count"}, {"type": "mc", "q": "Which organism is an omnivore?", "choices": ["Tadpole", "Small fish", "Turtle", "Heron"], "answer": 2, "why": "The turtle eats water lilies (plant) and snails (animal).", "check": "omnivores"}, {"type": "multi", "q": "Which organisms are herbivores? Pick all.", "options": ["Tadpole", "Mayfly larva", "Snail", "Small fish", "Turtle"], "answers": [0, 1, 2], "why": "They eat only algae or water lilies.", "check": "herbivores"}, {"type": "mc", "q": "Which organism is a tertiary consumer?", "choices": ["Heron", "Small fish", "Snail", "Turtle"], "answer": 0, "why": "Algae (1) → tadpole (2) → small fish (3) → heron (4).", "check": "tertiary"}, {"type": "mc", "q": "Which organism belongs to more than one trophic level?", "choices": ["Algae", "Tadpole", "Heron", "Turtle"], "answer": 3, "why": "Water lily → turtle (level 2) and water lily → snail → turtle (level 3).", "check": "multi"}]}, {"title": "Rule of 10 math", "how": "Show your steps. 1 point each.", "items": [{"type": "number", "q": "A producer has 4,000 calories. How many calories reach the secondary consumer?", "answer": 40, "unit": "calories", "why": "4,000 → 400 (primary) → 40 (secondary)."}, {"type": "number", "q": "An owl at level 4 (tertiary consumer) gets 3 calories. How many calories were in the producers at level 1?", "answer": 3000, "unit": "calories", "why": "Going down, multiply by 10 three times: 3 → 30 → 300 → 3,000."}]}, {"title": "Equations", "how": "1 point each.", "items": [{"type": "eq", "q": "Build the equation for photosynthesis.", "left": ["6CO₂", "6H₂O"], "right": ["C₆H₁₂O₆", "6O₂"], "note": "solar energy", "tail": "", "extra": ["12H₂O", "C₆H₆O₆", "6N₂"], "why": "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂"}, {"type": "eq", "q": "Build the equation for cellular respiration.", "left": ["C₆H₁₂O₆", "6O₂"], "right": ["6CO₂", "6H₂O"], "note": "", "tail": "+ energy (ATP)", "extra": ["3O₂", "6H₂", "C₆H₁₂O₂"], "why": "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP)"}]}]}}, "traps": [{"right": "Glycolysis makes 2 ATP and 2 NADH.", "slip": "Writing NADPH here.", "why": "NADPH (with a P) is photosynthesis. Respiration uses NADH and FADH₂."}, {"right": "The Krebs cycle uses pyruvate.", "slip": "Writing glucose.", "why": "Glucose is already split in glycolysis. Krebs gets the 2 pyruvate."}, {"right": "The Krebs cycle makes CO₂ and 2 ATP (plus NADH and FADH₂).", "slip": "Writing only CO₂.", "why": "It makes ATP too. Count it."}, {"right": "The ETC makes 34 ATP and water, and uses hydrogens and oxygen.", "slip": "Leaving off the 34 ATP or the hydrogens.", "why": "Most ATP comes from the ETC. Hydrogens + oxygen = water."}, {"right": "Photosynthesis step 1 is the light-dependent reaction. Step 2 is the light-independent reaction (Calvin cycle).", "slip": "Naming step 1 \"electron transport chain.\"", "why": "An ETC is inside step 1, but the step's name is the light-dependent reaction."}, {"right": "The light-dependent reaction makes ATP and NADPH, and gives off oxygen.", "slip": "Writing \"hydrogen and oxygen.\"", "why": "Water is split into hydrogen and oxygen, but what the stage makes for stage 2 is ATP and NADPH."}, {"right": "The Calvin cycle happens in the stroma.", "slip": "Putting it on the grana.", "why": "Grana: light-dependent. Stroma: Calvin."}, {"right": "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy.", "slip": "Dropping the 6H₂O.", "why": "Respiration makes CO₂ and water. Write both."}, {"right": "A numbers pyramid shows the number of organisms. Energy decreases going up.", "slip": "\"Represents the energy of organisms\" and \"energy available.\"", "why": "Number pyramid = number of organisms. Fewer at the top because energy decreases."}, {"right": "\"Which organism(s)\" can have more than one answer.", "slip": "Naming only the first one you find.", "why": "Check every food chain. Snake and hawk can both be tertiary."}, {"right": "The producer is level 1; the primary consumer is level 2.", "slip": "Calling the first animal level 1.", "why": "Count from the producer."}, {"right": "Glycolysis happens in the cytoplasm and needs no oxygen.", "slip": "Putting glycolysis in the mitochondria.", "why": "It happens before the cell reaches the mitochondria."}, {"right": "Sunlight isn't a reactant, and ATP isn't counted as a product.", "slip": "Listing them in the reactants or products.", "why": "Your notes say both are needed or released but aren't counted."}, {"right": "Spell it: mitochondria, tertiary, chloroplast, chlorophyll, thylakoid, stomata, detritivore, anaerobic, pyruvate.", "slip": "\"Mitconaria,\" \"tetiary,\" \"stemada.\"", "why": "If spelling counts, these are the ones to watch."}], "review": [{"head": "Energy flow", "lines": ["Sun → producers (autotrophs) → consumers (heterotrophs).", "Producers: nonliving energy. Photosynthesis (sunlight) or chemosynthesis (chemicals, deep-sea vent bacteria).", "Consumers: herbivore (plants), carnivore (meat), omnivore (both), detritivore/decomposer (dead material).", "Levels: 1 producer · 2 primary · 3 secondary · 4 tertiary. Arrows point food → eater.", "Rule of 10: 100% → 10% → 1% → 0.1%. The other 90% is used for metabolism or lost as heat.", "Pyramids: energy (energy per level; ALWAYS smaller going up), numbers (number of organisms; fewer at the top because energy decreases), biomass (total mass of living matter).", "Food web questions: check every chain; \"which organism(s)\" can have more than one answer."]}, {"head": "Photosynthesis (chloroplast)", "lines": ["6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (solar energy). Endothermic.", "Water in through the roots; CO₂ in through the stomata.", "Grana = stacks of thylakoid membrane (chlorophyll). Stroma = fluid between the grana.", "Step 1, light-dependent: grana. Sunlight + water in. Water split; O₂ out as waste; makes ATP + NADPH.", "Step 2, Calvin cycle (light-independent): stroma. CO₂ + ATP + NADPH in. Glucose out."]}, {"head": "Cellular respiration (mitochondria)", "lines": ["C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP). Exothermic. Goal: food → ATP.", "Inner membrane = folds. Matrix = fluid.", "Glycolysis: cytoplasm, no O₂ (anaerobic). Glucose → 2 pyruvate. Makes 2 ATP + 2 NADH.", "O₂ present → Krebs (citric acid) cycle: matrix. Pyruvate in. CO₂, 2 ATP, NADH, FADH₂ out.", "Then the ETC: inner membrane. Hydrogens + O₂ in. 34 ATP + H₂O out. Most ATP.", "Aerobic total 36-38 ATP. No O₂ → fermentation: lactic acid (muscles, some bacteria) or alcohol + CO₂ (yeast). Anaerobic total 2-4 ATP."]}, {"head": "The cycle", "lines": ["Photosynthesis makes glucose + O₂. Respiration uses them and makes CO₂ + H₂O, which photosynthesis uses again.", "Grass makes food and oxygen; the cow eats and breathes; the cow gives back CO₂ and water."]}], "confusables": [["aerobic", "anaerobic"], ["endothermic", "exothermic"], ["nadh", "nadph"], ["primary", "secondary", "tertiary"], ["grana", "stroma"], ["autotroph", "heterotroph"], ["autotrophs", "heterotrophs"], ["herbivore", "carnivore", "omnivore"], ["herbivores", "carnivores", "omnivores"], ["photosynthesis", "chemosynthesis"], ["mitochondria", "chloroplast"], ["matrix", "stroma"], ["roots", "stomata"]]}]</script>

function speakable(str) {
  var t = String(str == null ? "" : str);
  t = t.replace(/[₀-₉]/g, function (ch) { return String(ch.charCodeAt(0) - 8320); }).replace(/⁺/g, " plus");
  t = t.replace(/(\d)\s*[-–—]\s*(\d)/g, "$1 to $2");
  t = t.replace(/\b(\d*)([A-Z][A-Za-z0-9]*)\b/g, function (m, coef, w) {
    if (!/^([A-Z][a-z]?\d*)+$/.test(w)) return m;                    // ordinary words stay words
    var caps = (w.match(/[A-Z]/g) || []).length, digits = /\d/.test(w);
    if (!digits && (caps < 2 || /[a-z]/.test(w))) return m;           // "I", "He": leave alone
    return (coef ? coef + " " : "") + w.replace(/([A-Z][a-z]?)(\d*)/g, function (_, el, n) { return el + " " + (n ? n + " " : ""); }).trim();
  });
  t = t.replace(/→/g, " to ").replace(/←/g, " from ").replace(/\s\+\s/g, " plus ").replace(/·/g, ", ")
       .replace(/\(s\)/g, "s").replace(/\bvs\./g, "versus").replace(/_{3,}/g, " blank ");
  return t.replace(/\s+/g, " ").trim();
}
function speak(text) {
  if (!canSpeak || !text) return;
  try {
    var ss = window.speechSynthesis; ss.cancel();
    var u = new window.SpeechSynthesisUtterance(speakable(text));
    u.rate = 0.95; if (!voice) voice = pickVoice(); if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-US";
    ss.speak(u);
  } catch (e) {}
}
function hush() { if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} } lastSaid = null; }
function sayBtn(text, label) { return canSpeak && text ? '<button class="speak" data-act="say" data-say="' + h(text) + '" aria-label="' + h(label || "Read it to me") + '">' + ICON.speak + '</button>' : ''; }
function readToggle() { if (!canSpeak) return ''; var on = !!cs("_app").read; return '<button class="readto" data-act="readto" aria-pressed="' + on + '">' + ICON.speak + 'Read to me: ' + (on ? 'on' : 'off') + '</button>'; }
function autoSay(text) { if (!cs("_app").read || !text || text === lastSaid) return; lastSaid = text; speak(text); }

// ---------- answer checking
function norm(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[₀-₉]/g, function (c) { return String(c.charCodeAt(0) - 8320); })
    .replace(/⁺/g, "+").replace(/[–—]/g, "-").replace(/\s*-\s*/g, "-")
    .replace(/[.,!?;:'"()%]/g, " ").replace(/\s+/g, " ").trim()
    .replace(/^(the|a|an) /, "");
}
function lev(a, b) {
  if (a === b) return 0; var m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  var prev = [], cur = []; for (var j = 0; j <= n; j++) prev[j] = j;
  for (var i = 1; i <= m; i++) { cur = [i]; for (j = 1; j <= n; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); } prev = cur; }
  return prev[n];
}
function checkFill(course, item, typed) {
  var t = norm(typed); if (!t) return false;
  var targets = [item.answer].concat(item.accept || []).map(norm);
  if (targets.indexOf(t) >= 0) return true;
  if (item.strict) return false;
  var groups = course.confusables || [];
  for (var k = 0; k < targets.length; k++) {
    var target = targets[k]; if (target.length < 5) continue;
    var tol = target.length >= 9 ? 2 : 1, d = lev(t, target);
    if (d > tol) continue;
    var clash = false;
    groups.forEach(function (g) { if (g.indexOf(target) < 0) return; g.forEach(function (sib) { if (sib === target) return; var ds = lev(t, sib); if (ds < d || (ds === d && pre(t, sib) >= pre(t, target))) clash = true; }); });
    if (!clash) return true;
  }
  return false;
}
function pre(a, b) { var i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }
function parseNum(s) { var t = String(s || "").replace(/,/g, "").replace(/[^0-9.\-]/g, " ").trim().split(/\s+/)[0]; if (t === "" || t === undefined) return NaN; return parseFloat(t); }
function checkNum(item, typed) { var v = parseNum(typed); return !isNaN(v) && Math.abs(v - item.answer) < 1e-9; }
function sameSet(a, b) { return a.length === b.length && a.slice().sort().join("|") === b.slice().sort().join("|"); }

// ---------- routing
function route() {
  var hs = (location.hash || "").replace(/^#/, "");
  if (!hs || hs === "home") return { view: "home" };
  var p = hs.split("-"), c = byId[p[0]];
  if (!c) return { view: "home" };
  return { course: c, view: p[1] || "plan", arg: p.slice(2).join("-") };
}
function go(hash) { if (location.hash === "#" + hash) render(); else location.hash = hash; }

// ---------- step naming
function stepKey(st, night, i) { return st.do === "text" ? "text:" + night.id + "-" + i : st.do + ":" + (st.ref || ""); }
function isBreak(st) { return st.do === "break"; }
function stepName(c, st) {
  if (st.do === "lesson") { var L = lessonById(c, st.ref); return "Lesson: " + (L ? L.title : st.ref); }
  if (st.do === "drill") { var d = drillById(c, st.ref); return d ? d.title : st.ref; }
  if (st.do === "flash") return st.ref === "all" ? "Flashcards: everything" : st.ref === "star" ? "Flashcards: your starred cards" : "Flashcards: Night " + st.ref;
  if (st.do === "quiz") return st.ref === "all" ? "Mixed quiz: everything" : "Quick quiz: Night " + st.ref;
  if (st.do === "test") return (c.tests[st.ref] ? c.tests[st.ref].name : "Practice test") + " (" + testPoints(c.tests[st.ref]) + " points)";
  if (st.do === "traps") return "Easy to mix up";
  if (st.do === "review") return "One-page review";
  if (st.do === "warm") return "Warm-up: 6 cards from before";
  if (st.do === "guess") return "Guess first: 3 questions about tonight";
  if (st.do === "teach") return "Teach it back: 3 things to Dad or Mom";
  if (st.do === "tips") return "Test-day tips";
  return st.text || "";
}
function stepHash(c, st) {
  if (st.do === "lesson") return c.id + "-lesson-" + st.ref;
  if (st.do === "drill") return c.id + "-drill-" + st.ref;
  if (st.do === "flash") return c.id + "-flash-" + st.ref;
  if (st.do === "quiz") return c.id + "-quiz-" + st.ref;
  if (st.do === "test") return c.id + "-test";
  if (st.do === "traps") return c.id + "-traps";
  if (st.do === "review") return c.id + "-review";
  if (st.do === "warm") return c.id + "-flash-warm" + st.ref;
  if (st.do === "guess") return c.id + "-flash-guess" + st.ref;
  if (st.do === "teach") return c.id + "-teach-" + st.ref;
  if (st.do === "tips") return c.id + "-tips";

}
function lessonById(c, id) { return c.lessons.filter(function (l) { return l.id === id; })[0]; }
function drillById(c, id) { return c.drills.filter(function (d) { return d.id === id; })[0]; }
function allSteps(c) { var out = []; c.nights.forEach(function (n) { n.steps.forEach(function (st, i) { if (!isBreak(st)) out.push(stepKey(st, n, i)); }); }); return out; }
function progress(c) { var keys = allSteps(c), uniq = keys.filter(function (k, i) { return keys.indexOf(k) === i; }); var d = uniq.filter(function (k) { return isDone(c.id, k); }).length; return { done: d, total: uniq.length }; }

// ---------- HOME
function viewHome() {
  document.documentElement.removeAttribute("data-hue");
  var t = todayISO();
  var up = COURSES.filter(function (c) { return c.testDate >= t; }).sort(function (a, b) { return a.testDate < b.testDate ? -1 : 1; });
  var past = COURSES.filter(function (c) { return c.testDate < t; }).sort(function (a, b) { return a.testDate > b.testDate ? -1 : 1; });
  function cardFor(c) {
    var d = daysUntil(c.testDate), pr = progress(c), pct = pr.total ? Math.round(100 * pr.done / pr.total) : 0;
    var box = d < 0 ? '<b>✓</b><span>done</span>' : d === 0 ? '<b>!</b><span>today</span>' : '<b>' + d + '</b><span>' + (d === 1 ? "day" : "days") + '</span>';
    return '<a class="card testcard" data-hue="' + h(c.hue || "") + '" href="#' + c.id + '-plan"><div class="daybox">' + box + '</div><div class="info">' +
      '<span class="subject">' + h(c.subject) + '</span><h2>' + h(c.title) + '</h2><span class="muted small">' + h(c.testLabel) + ' · ' + pr.done + ' of ' + pr.total + ' steps done</span>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div></div></a>';
  }
  var body = '<section class="hero"><span class="eyebrow">Study Hall</span><h1>What are we studying?</h1><p class="muted">Pick a test. Each one has a nightly plan, short lessons, flashcards, quizzes and a practice test.</p></section>' +
    (up.length ? '<h3>Coming up</h3>' + up.map(cardFor).join("") : '<div class="card">No tests coming up. New ones show up here when Dad adds them.</div>') +
    (past.length ? '<h3 style="padding-top:8px">Past tests</h3><p class="muted small">Still here for finals review.</p>' + past.map(cardFor).join("") : "") +
    (cs("_app").tipHidden ? "" : '<div class="card tip">' + ICON.share + '<div class="stack" style="gap:6px"><b>Keep it on your home screen</b><span class="small muted">In Safari, tap the Share button, then "Add to Home Screen." It opens like an app.</span><button class="btn" data-act="hidetip" style="align-self:flex-start;min-height:38px">Got it</button></div></div>') +
    '<p class="foot">No sign-in. Your check marks save on this phone.<br>Updated ' + h(BUILT) + '</p>';
  page('<div class="top"><div class="wrap"><div class="t"><b>Study Hall</b><span>' + h(new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })) + '</span></div></div></div>', body, null);
}

// ---------- PLAN

// ---------- FLASHCARDS (also the warm-up and guess-first decks)
function deckFor(c, ref) {
  var st = cs(c.id).stars, m = /^(warm|guess)(\d+)$/.exec(ref);
  if (ref === "all") return shuffle(c.flashcards);
  if (ref === "star") return shuffle(c.flashcards.filter(function (f) { return st[f.id]; }));
  if (m && m[1] === "warm") {
    var before = c.flashcards.filter(function (f) { return f.night < +m[2]; });
    return shuffle(before.filter(function (f) { return st[f.id]; })).concat(shuffle(before.filter(function (f) { return !st[f.id]; }))).slice(0, 6);
  }
  if (m) return pick(c.flashcards.filter(function (f) { return f.night === +m[2]; }), 3);
  return shuffle(c.flashcards.filter(function (f) { return String(f.night) === ref; }));
}
function viewFlash(c, ref) {
  var st = cs(c.id).stars, guess = /^guess/.test(ref), warm = /^warm/.test(ref);
  var s = session.flash && session.flash.ref === ref ? session.flash : null;
  if (!s) s = session.flash = { ref: ref, deck: deckFor(c, ref).map(function (f) { return f.id; }), i: 0, flip: false, back: {} };
  var title = ref === "all" ? "All cards" : ref === "star" ? "Starred cards" : warm ? "Warm-up: from before" : guess ? "Guess first" : "Night " + ref + " cards";
  var body, say = "";
  if (!s.deck.length) {
    body = '<div class="card stack"><h2>No starred cards yet</h2><p>Tap "Not yet" on any card you don\'t know and it gets a star. Starred cards come back here.</p><a class="btn primary" href="#' + c.id + '-flash-all">Go through all the cards</a></div>';
  } else if (s.i >= s.deck.length) {
    markDone(c.id, warm ? "warm:" + ref.slice(4) : guess ? "guess:" + ref.slice(5) : "flash:" + ref);
    var n = s.deck.filter(function (id, j) { return st[id] && s.deck.indexOf(id) === j; }).length;

// ---------- REVIEW + TRAPS
function viewReview(c) {
  var body = '<section class="stack" style="gap:6px"><span class="eyebrow">Review</span><h1>One-page review</h1><p class="muted">Wednesday night and Thursday morning.</p></section>' +
    '<p class="hook">Don\'t just read it. Read one line, look away and say it out loud. Then the next line.</p>' +
    c.review.map(function (r) { return '<section class="card review stack"><div class="headrow"><h3>' + h(r.head) + '</h3>' + sayBtn(r.head + ". " + r.lines.join(" ")) + '</div><ul>' + r.lines.map(function (l) { return '<li>' + h(l) + '</li>'; }).join("") + '</ul></section>'; }).join("") +
    '<a class="btn wide" href="#' + c.id + '-traps">Easy to mix up (' + c.traps.length + ')</a>' + (c.testTips ? '<a class="btn wide" href="#' + c.id + '-tips">Test-day tips</a>' : '') +
    '<button class="btn primary wide" data-act="rdone">I went through it</button>';
  page(topbar(c.subject, "Review", c.id + "-plan"), body, c, "review");
}
function viewTraps(c) {
  var body = '<section class="stack" style="gap:6px"><span class="eyebrow">Review</span><h1>Easy to mix up</h1><p class="muted">The right answer comes first. These are the spots where points get lost.</p></section>' +
    c.traps.map(function (t) { return '<div class="card trap"><span class="r">' + h(t.right) + '</span><span class="s">' + h(t.slip) + '</span><span class="small">' + h(t.why) + '</span></div>'; }).join("") +
    '<button class="btn primary wide" data-act="trdone">Got them</button>';
  page(topbar(c.subject, "Easy to mix up", c.id + "-review"), body, c, "review");
}

// ---------- TEACH IT BACK + TEST-DAY TIPS
function viewTeach(c, nid) {
  var n = c.nights.filter(function (x) { return x.id === nid; })[0]; if (!n || !n.teach) return go(c.id + "-plan");
  var s = session.teach && session.teach.id === nid ? session.teach : (session.teach = { id: nid, shown: {} });
  var body = '<section class="stack" style="gap:6px"><span class="eyebrow">' + h(n.label) + ' · Teach it back</span><h1>Teach Dad or Mom</h1>' +
    '<p class="muted">No notes. Explain each one out loud like you\'re the teacher. Draw it if that helps. They can tap to check you.</p></section>' +
    n.teach.map(function (q, j) {
      return '<div class="reveal"><div class="headrow"><b>' + (j + 1) + '. ' + h(q.q) + '</b>' + sayBtn(q.q) + '</div>' + (s.shown[j] ? '<span class="a">' + h(q.a) + '</span>' : '<button class="btn" data-act="tshow" data-k="' + j + '" style="align-self:flex-start;min-height:38px">Show answer</button>') + '</div>';
    }).join("") + '<button class="btn primary wide" data-act="tdone" data-key="teach:' + h(nid) + '">I taught it</button>';
  page(topbar(c.subject, "Teach it back", c.id + "-plan"), body, c, "plan");
}
function viewTips(c) {
  var tips = c.testTips || [];
  var body = '<section class="stack" style="gap:6px"><span class="eyebrow">Test day</span><h1>Test-day tips</h1><p class="muted">Go over them the night before and again in the morning.</p></section>' +
    '<div class="card"><div class="headrow"><ol class="numlist">' + tips.map(function (t) { return '<li>' + h(t) + '</li>'; }).join("") + '</ol>' + sayBtn(tips.join(" ")) + '</div></div>' +
    '<button class="btn primary wide" data-act="tipsdone">Got them</button>';
  page(topbar(c.subject, "Test-day tips", c.id + "-plan"), body, c, "review");
}

// ---------- actions
function act(name, el) {
  var r = route(), c = r.course, k = el && el.getAttribute("data-key");
  switch (name) {
    case "hidetip": cs("_app").tipHidden = 1; save(); return render();
    case "toggle": var s = cs(c.id); if (s.done[k]) delete s.done[k]; else s.done[k] = Date.now(); save(); return render();
    case "say": speak(el.getAttribute("data-say")); return;
    case "readto": var ap = cs("_app"); ap.read = !ap.read; save(); if (!ap.read) hush(); else lastSaid = null; return renderKeep();
    case "lnext": case "lgot": session.lesson.pos++; session.lesson.phase = "see"; window.scrollTo(0, 0); return render();
    case "lprev": session.lesson.pos = Math.max(0, session.lesson.pos - 1); session.lesson.phase = "see"; window.scrollTo(0, 0); return render();
    case "ltest": session.lesson.phase = "say"; window.scrollTo(0, 0); return render();
    case "lshowa": session.lesson.phase = "check"; return render();
    case "lpeek": session.lesson.phase = "see"; return render();
    case "lagain": var ls = session.lesson, kk = ls.queue[ls.pos];
      if ((ls.again[kk] || 0) < 2) { ls.again[kk] = (ls.again[kk] || 0) + 1; ls.queue.splice(Math.min(ls.pos + 4, ls.queue.length), 0, kk); }
      ls.pos++; ls.phase = "see"; window.scrollTo(0, 0); return render();
    case "lshow": session.lesson.shown[el.getAttribute("data-k")] = 1; return render();
    case "lfinish": markDone(c.id, "lesson:" + r.arg); return go(c.id + "-plan");
    case "fflip": session.flash.flip = true; return render();
    case "fstar": var st = cs(c.id).stars, id = session.flash.deck[session.flash.i]; st[id] = !st[id]; save(); return render();
    case "fno": var fs = session.flash, fid = fs.deck[fs.i]; cs(c.id).stars[fid] = true; save();
      if (!fs.back[fid]) { fs.back[fid] = 1; fs.deck.splice(Math.min(fs.i + 4, fs.deck.length), 0, fid); }
      fs.i++; fs.flip = false; return render();
    case "fnext": session.flash.i++; session.flash.flip = false; return render();
    case "fyes": delete cs(c.id).stars[session.flash.deck[session.flash.i]]; save(); session.flash.i++; session.flash.flip = false; return render();
    case "freset": session.flash = null; return render();
    case "qpick": var q = session.quiz, it = q.qs[q.i], pk = +el.getAttribute("data-i"), ok = pk === it.src.answer;
      q.answered = { pick: pk, ok: ok }; if (ok) q.right++; else q.misses.push({ q: it.src.q, a: it.src.choices[it.src.answer], why: it.src.why }); return render();
    case "qcheck": q = session.quiz; it = q.qs[q.i]; var typed = ($("#qfill") || {}).value || ""; ok = checkFill(c, it.src, typed);
      q.answered = { typed: typed, ok: ok }; if (ok) q.right++; else q.misses.push({ q: it.src.sentence, a: it.src.answer, why: it.src.why }); return render();
    case "qnext": session.quiz.i++; session.quiz.answered = null; window.scrollTo(0, 0); return render();
    case "qnew": session.quiz = null; return render();
    case "pick": session.ans[k] = +el.getAttribute("data-i"); return renderKeep();
    case "multi": readInputs(); var arr = session.ans[k] || [], oi = +el.getAttribute("data-i"); if (el.checked) { if (arr.indexOf(oi) < 0) arr.push(oi); } else arr = arr.filter(function (x) { return x !== oi; }); session.ans[k] = arr; return;
    case "eqtile": readInputs(); var e = session.ans[k], ti = +el.getAttribute("data-t"), free = e.slots.indexOf(null); if (free >= 0) e.slots[free] = ti; return renderKeep();
    case "eqslot": readInputs(); session.ans[k].slots[+el.getAttribute("data-s")] = null; return renderKeep();
    case "dcheck": readInputs(); session.checked = true; var d = drillById(c, r.arg); if (d) markDone(c.id, "drill:" + d.id); return renderKeep();
    case "dshow": session.checked = true; window.scrollTo(0, 0); return render();
    case "ddone": markDone(c.id, "drill:" + r.arg); return go(c.id + "-plan");
    case "tshow": session.teach.shown[el.getAttribute("data-k")] = 1; return renderKeep();
    case "tdone": markDone(c.id, k); return go(c.id + "-plan");
    case "tipsdone": markDone(c.id, "tips:"); return go(c.id + "-plan");
    case "dreset": session.checked = false; session.ans = {}; window.scrollTo(0, 0); return render();
    case "r10check": var p = session.r10.probs[session.r10.i], ty = ($("#r10in") || {}).value || ""; ok = checkNum(p, ty) || (p.unit === "percent" && checkNum(p, ty.replace("%", "")));
      session.r10.answered = { typed: ty, ok: ok }; if (ok) session.r10.right++; return render();
    case "r10next": session.r10.i++; session.r10.answered = null; return render();
    case "r10new": session.r10 = null; return render();
    case "tsubmit": readInputs(); session.checked = true; var t = c.tests.A, pts = 0;
      t.sections.forEach(function (s, si) { s.items.forEach(function (it2, ii) { pts += grade(c, it2, "t" + si + "-" + ii).pts; }); });
      var best = cs(c.id).best, bk = "test:A", tot = testPoints(t); if (!best[bk] || pts > parseInt(best[bk], 10)) { best[bk] = pts + "/" + tot; }
      save(); markDone(c.id, "test:A"); window.scrollTo(0, 0); return render();
    case "tretake": session.checked = false; session.ans = {}; window.scrollTo(0, 0); return render();
    case "rdone": markDone(c.id, "review:"); return go(c.id + "-plan");
    case "trdone": markDone(c.id, "traps:"); return go(c.id + "-plan");
  }
}
function renderKeep() { var y = window.scrollY; render(); window.scrollTo(0, y); }
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "INPUT") return;  // checkboxes handled on change
  e.preventDefault(); act(el.getAttribute("data-act"), el);
});
document.addEventListener("change", function (e) { var el = e.target; if (el.matches('input[type="checkbox"][data-act]')) act(el.getAttribute("data-act"), el); else if (el.matches(".ans[data-key]")) session.ans[el.getAttribute("data-key")] = el.value; });
document.addEventListener("input", function (e) { var el = e.target; if (el.matches("input.ans[data-key]")) session.ans[el.getAttribute("data-key")] = el.value; });
document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.id === "r10in") { e.preventDefault(); act("r10check"); } });

// ---------- render
function render() {
  var r = route();
  session.ans = session.ans || {};
  if (r.view === "home") return viewHome();
  var c = r.course;
  document.documentElement.setAttribute("data-hue", c.hue || "");
  switch (r.view) {
    case "plan": return viewPlan(c);
    case "learn": return viewLearn(c);
    case "lesson": return viewLesson(c, r.arg);
    case "practice": return viewPractice(c);
    case "flash": return viewFlash(c, r.arg || "all");
    case "quiz": return viewQuiz(c, r.arg || "all");
    case "drill": return viewDrill(c, r.arg);
    case "test": return viewTest(c);
    case "review": return viewReview(c);
    case "traps": return viewTraps(c);
    case "teach": return viewTeach(c, r.arg);
    case "tips": return viewTips(c);
  }
  return viewPlan(c);
}
window.__study = { act: act, route: route, checkFill: checkFill, session: function () { return session; }, COURSES: COURSES, grade: grade, speakable: speakable, canSpeak: canSpeak, pickVoice: pickVoice };
render();
})();
</script>

</body>
</html>
