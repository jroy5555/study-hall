<style>
/* Layout: one phone-width column; sticky top bar, scrolling study surface, fixed bottom tabs inside a test.
   Look: a lab notebook. Paper-white ground with a faint green cast, ink-dark text, one subject hue per test. */
:root {
  --bg: #f4f6f2; --surface: #ffffff; --surface2: #eef2ec; --ink: #17211b; --muted: #5a6a60;
  --line: #dbe3dc; --line-strong: #b9c6bc;
  --accent: #2c7a4b; --accent-ink: #1f5c37; --accent-soft: #e2f0e6; --on-accent: #ffffff;
  --leaf: #2f8a52; --leaf-deep: #1d5e36; --leaf-soft: #e1f1e5; --leaf-soft2: #c9e6d1;
  --clay: #b5603a; --clay-soft: #f7e4d9; --clay-soft2: #fbefe8;
  --sun: #e2a527; --sun-soft: #fbf0d3; --water: #2f6fa8; --water-soft: #e1ecf6;
  --good: #23784a; --good-soft: #dff1e6; --bad: #b4452a; --bad-soft: #f8e3dc;
  --shadow: 0 1px 2px rgba(23,33,27,.06), 0 4px 14px rgba(23,33,27,.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1411; --surface: #17201b; --surface2: #1d2822; --ink: #e5ede7; --muted: #9aaba0;
  --line: #29352e; --line-strong: #3b4a41;
  --accent: #5cbf85; --accent-ink: #8fd8ab; --accent-soft: #1b3325; --on-accent: #0b1a11;
  --leaf: #59b47c; --leaf-deep: #8fd8ab; --leaf-soft: #193024; --leaf-soft2: #22402f;
  --clay: #e0895f; --clay-soft: #3a2419; --clay-soft2: #2c1d15;
  --sun: #f0bd4f; --sun-soft: #3a3020; --water: #7fb3e3; --water-soft: #1b2b3a;
  --good: #6fd09a; --good-soft: #17301f; --bad: #f08c6e; --bad-soft: #3a211a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #17201b; --surface2: #1d2822; --ink: #e5ede7; --muted: #9aaba0;
  --line: #29352e; --line-strong: #3b4a41;
  --accent: #5cbf85; --accent-ink: #8fd8ab; --accent-soft: #1b3325; --on-accent: #0b1a11;
  --leaf: #59b47c; --leaf-deep: #8fd8ab; --leaf-soft: #193024; --leaf-soft2: #22402f;
  --clay: #e0895f; --clay-soft: #3a2419; --clay-soft2: #2c1d15;
  --sun: #f0bd4f; --sun-soft: #3a3020; --water: #7fb3e3; --water-soft: #1b2b3a;
  --good: #6fd09a; --good-soft: #17301f; --bad: #f08c6e; --bad-soft: #3a211a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark; }
/* subject hues: a test's hue swaps the accent */
[data-hue="clay"] { --accent: var(--clay); --accent-soft: var(--clay-soft); --accent-ink: var(--clay); }
[data-hue="sky"] { --accent: var(--water); --accent-soft: var(--water-soft); --accent-ink: var(--water); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 800; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-ink); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; min-height: 54px; }
.top .t { flex: 1; min-width: 0; }
.top .t b { display: block; font-family: var(--font-display); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .t span { display: block; font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
main { padding-block: 18px 120px; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding-block: 6px; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: .74rem; font-weight: 600; color: var(--muted); text-decoration: none; }
.tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.plain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 700; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btnrow { display: flex; gap: 10px; }
.btnrow > * { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--accent-soft); color: var(--accent-ink); }
.pill.warm { background: var(--sun-soft); color: var(--ink); }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* home */
.hero { padding-block: 8px 4px; display: flex; flex-direction: column; gap: 6px; }
.hero h1 { font-size: 2.3rem; }
.testcard { display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: center; text-decoration: none; color: inherit; }
.daybox { width: 58px; height: 64px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; text-align: center; line-height: 1; }
.daybox b { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; display: block; }
.daybox span { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.testcard .info { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.subject { font-size: .8rem; font-weight: 700; color: var(--muted); }
.tip { display: flex; gap: 12px; align-items: flex-start; border-style: dashed; box-shadow: none; }
.tip svg { width: 22px; height: 22px; flex: none; stroke: var(--accent-ink); fill: none; stroke-width: 2; }

/* plan */
.night { padding: 0; overflow: hidden; }
.night header { padding: 14px 16px 10px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.night.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.steps li { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.check { width: 48px; height: 48px; flex: none; border: 0; background: none; display: grid; place-items: center; }
.check span { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-strong); display: grid; place-items: center; }
.check[aria-pressed="true"] span { background: var(--accent); border-color: var(--accent); }
.check svg { width: 16px; height: 16px; stroke: var(--on-accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check[aria-pressed="true"] svg { opacity: 1; }
.steps a, .steps .txt { flex: 1; min-width: 0; padding: 12px 14px 12px 0; text-decoration: none; color: inherit; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.steps a::after { content: "›"; font-size: 1.4rem; color: var(--muted); line-height: 1; }
.steps .done-t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }

/* lessons */
.lessonlist a { display: flex; gap: 12px; align-items: center; padding: 14px 16px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--line); }
.lessonlist a:last-child { border-bottom: 0; }
.lnum { width: 34px; height: 34px; border-radius: 10px; background: var(--surface2); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); flex: none; }
.lnum.ok { background: var(--accent); color: var(--on-accent); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 9px; background: var(--line-strong); }
.dots i.on { background: var(--accent); width: 20px; }
.lcard h2 { font-size: 1.45rem; }
.lcard .body { font-size: 1.08rem; line-height: 1.6; }
.hook { background: var(--sun-soft); border-radius: 12px; padding: 12px 14px; font-weight: 600; display: flex; gap: 10px; }
.hook::before { content: "Remember"; font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }
.visual { border-radius: 12px; background: var(--surface2); padding: 10px; overflow-x: auto; }
.visual figcaption { font-size: .82rem; color: var(--muted); padding: 6px 4px 0; }
.dg { width: 100%; height: auto; display: block; max-width: 520px; margin: 0 auto; }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 420px; }
table.t th, table.t td { text-align: left; vertical-align: top; padding: 8px 9px; border-bottom: 1px solid var(--line); }
table.t th { font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
table.t td:first-child { font-weight: 700; }
.reveal { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.reveal .a { color: var(--accent-ink); font-weight: 600; }

/* questions */
.q { font-size: 1.12rem; font-weight: 600; line-height: 1.45; }
.choices { display: flex; flex-direction: column; gap: 9px; }
.choice { text-align: left; padding: 13px 14px; min-height: 50px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 500; display: flex; gap: 10px; align-items: center; }
.choice .k { width: 26px; height: 26px; flex: none; border-radius: 8px; background: var(--surface2); display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; }
input.ans { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 1.05rem; }
input.ans.right { border-color: var(--good); background: var(--good-soft); }
input.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
select.ans { width: 100%; min-height: 46px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); }
select.ans.right { border-color: var(--good); background: var(--good-soft); }
select.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { border-radius: 12px; padding: 12px 14px; font-weight: 500; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb b { display: block; }
.blank { display: inline-block; min-width: 70px; border-bottom: 2px solid var(--ink); }
.multi { display: flex; flex-direction: column; gap: 8px; }
.multi label { display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); }
.multi input { width: 20px; height: 20px; accent-color: var(--accent); }
.pinrow { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; }
.pinno { width: 28px; height: 28px; border-radius: 99px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; }
.score { text-align: center; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.score .big { font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 1; }
.goal-ok { color: var(--good); font-weight: 700; }
.goal-no { color: var(--bad); font-weight: 700; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec h3 { padding-top: 8px; border-top: 2px solid var(--ink); }
.item { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.item .num { font-weight: 800; color: var(--muted); font-size: .85rem; }
.mark { font-weight: 800; }
.mark.ok { color: var(--good); }
.mark.no { color: var(--bad); }

/* equation builder */
.eq { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 12px 6px; background: var(--surface2); border-radius: 12px; }
.slot { min-width: 72px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 2px dashed var(--line-strong); background: var(--surface); font-weight: 800; font-size: 1.02rem; }
.slot.full { border-style: solid; border-color: var(--accent); }
.slot.right { border-color: var(--good); background: var(--good-soft); }
.slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
.eq .side { display: flex; align-items: center; gap: 6px; }
.op { font-weight: 800; font-size: 1.1rem; }
.op.tail { font-size: .9rem; white-space: nowrap; }
.arrow { display: flex; flex-direction: column; align-items: center; font-weight: 800; line-height: 1; }
.arrow small { font-size: .62rem; font-weight: 700; color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 800; font-size: 1.02rem; }
.tile:disabled { opacity: .25; }

/* flashcards */
.flash { min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; padding: 26px 20px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); position: relative; width: 100%; }
.flash .side { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.flash .front { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1.2; }
.flash .back { font-size: 1.12rem; line-height: 1.55; }
.flash.flipped { background: var(--accent-soft); border-color: var(--accent); }
.star { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; }
.star svg { width: 26px; height: 26px; stroke: var(--sun); stroke-width: 2; fill: none; }
.star[aria-pressed="true"] svg { fill: var(--sun); }

/* traps / review */
.trap { display: flex; flex-direction: column; gap: 6px; }
.trap .r { font-weight: 700; }
.trap .r::before { content: "✓ "; color: var(--good); }
.trap .s { color: var(--muted); font-size: .92rem; }
.trap .s::before { content: "Easy slip: "; font-weight: 700; }
.review h3 { color: var(--accent-ink); }
.review ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.foot { text-align: center; font-size: .8rem; color: var(--muted); padding-top: 18px; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .22s ease-out; } @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
@media (max-width: 380px) { h1 { font-size: 1.6rem; } .hero h1 { font-size: 2rem; } }
/* read aloud */
.speak { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; padding: 0; }
.speak svg { width: 22px; height: 22px; stroke: var(--accent-ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.headrow { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.headrow > :first-child { flex: 1; min-width: 0; }
.readto { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: .85rem; font-weight: 700; align-self: flex-start; }
.readto svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.readto[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
/* say it back */
.recall { border: 2px dashed var(--accent); background: var(--accent-soft); box-shadow: none; }
.recall .q { font-size: 1.28rem; font-family: var(--font-display); font-weight: 700; }
.recall .a { font-size: 1.12rem; font-weight: 700; color: var(--accent-ink); }
.peek { background: none; border: 0; padding: 8px 0; font-weight: 600; color: var(--muted); text-decoration: underline; align-self: center; }
.way { display: flex; gap: 6px; flex-wrap: wrap; }
.way span { padding: 4px 11px; border-radius: 999px; background: var(--sun-soft); font-weight: 700; font-size: .84rem; }
/* plan extras */
.steps li.brk { justify-content: center; padding: 8px 12px; font-size: .82rem; font-weight: 700; color: var(--muted); background: var(--surface2); }
.look { display: flex; flex-direction: column; gap: 8px; }
.look label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); }
.look input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.numlist { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
/* diagrams */
.dg-ink, .dg-arrow { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.dg-head { fill: var(--ink); }
.dg-t { fill: var(--ink); font-family: var(--font-body); }
.dg-tm { fill: var(--muted); font-family: var(--font-body); }
.dg-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.4; }
.dg-leaf, .dg-stroma { fill: var(--leaf-soft); stroke: var(--leaf); stroke-width: 1.4; }
.dg-leaf2 { fill: var(--leaf-soft2); stroke: var(--leaf); stroke-width: 2; }
.dg-thyl { fill: var(--leaf); stroke: var(--leaf-deep); stroke-width: 1; }
.dg-thin { fill: none; stroke: var(--leaf); stroke-width: 3; }
.dg-hi { fill: none; stroke: var(--sun); stroke-width: 2.6; }
.dg-brk { fill: none; stroke: var(--sun); stroke-width: 2.6; stroke-linejoin: round; }
.dg-mito { fill: var(--clay-soft); stroke: var(--clay); stroke-width: 2; }
.dg-matrix { fill: var(--clay-soft2); stroke: var(--clay); stroke-width: 1.6; }
.dg-crista { fill: var(--clay-soft); stroke: var(--clay); stroke-width: 1.8; }
.dg-cell { fill: var(--sun-soft); stroke: var(--sun); stroke-width: 1.4; }
.dg-sun { fill: var(--sun); }
.dg-stem { fill: none; stroke: var(--leaf); stroke-width: 5; stroke-linecap: round; }
.dg-root { fill: none; stroke: var(--clay); stroke-width: 2.4; stroke-linecap: round; }
.dg-ground { stroke: var(--clay); stroke-width: 2; }
.dg-lead { stroke: var(--muted); stroke-width: 1.2; }
.dg-dot { fill: var(--muted); }
.dg-pin { fill: var(--accent); }
.dg-pint { fill: var(--on-accent); font-weight: 700; font-family: var(--font-body); }
</style>

<script id="courses" type="application/json">[{"id": "bio", "subject": "Biology", "title": "Energy Flow test", "unit": "Energy Flow Unit · Concepts 3, 4 and 5", "covers": "Energy flow through ecosystems, photosynthesis and cellular respiration (packet pages 17-37).", "testDate": "2026-11-19", "testLabel": "Thursday, Nov 19", "goalPct": 80, "goalLine": "Goal: 80% or better. On the 40-point practice tests that's 32 points.", "hue": "leaf", "learnWay": "See it. Hear it. Say it. Check it.", "howItWorks": ["Reading a page over and over doesn't make it stick. Pulling it back out of your head does. So every card asks you a question.", "See it: one idea per card, with a picture. Hear it: tap the speaker, or turn on Read to me.", "Say it: the card hides and asks you one question. Say the answer out loud before you check. Cards you miss come back.", "Short rounds: about 10-15 minutes, then a 2-minute break.", "Each night starts with a quick warm-up (Night 1: guess first). Nights 1-4 include teaching Dad or Mom 3 things, no notes.", "Practice Test A is on this app (Night 4). Dad has Practice Test B on paper for Wednesday."], "testTips": ["Read the question. Then cover the choices with your hand.", "Answer it in your head first. Then find your answer in the choices.", "Circle the key word in the question, like \"not,\" \"where\" or \"product.\"", "Stuck? Draw it in the margin: the pyramid, the chloroplast or the mitochondrion.", "If your first answer matches what you studied, keep it. Only cross it out if you can say why it's wrong.", "\"Which organism(s)\" can have more than one answer. Check every chain."], "nights": [{"id": "n1", "date": "2026-11-14", "label": "Night 1", "day": "Sat, Nov 14", "minutes": "about 40 min, 3 short rounds", "title": "Energy flow", "steps": [{"do": "guess", "ref": "1"}, {"do": "lesson", "ref": "L1"}, {"do": "lesson", "ref": "L2"}, {"do": "break"}, {"do": "lesson", "ref": "L3"}, {"do": "drill", "ref": "rule10"}, {"do": "drill", "ref": "web1"}, {"do": "break"}, {"do": "drill", "ref": "draw-pyramid"}, {"do": "quiz", "ref": "1"}, {"do": "teach", "ref": "n1"}], "teach": [{"q": "Draw a food chain. Which way do the arrows point, and why?", "a": "From the food to the eater: the way the energy flows."}, {"q": "What's the Rule of 10? If grass has 5,000 calories, how many reach the secondary consumer?", "a": "Only about 10% moves up a level; the rest is used or lost as heat. 5,000 → 500 → 50 calories."}, {"q": "What's the difference between a producer and a consumer? Give an example of each.", "a": "A producer (autotroph) makes its own food from sunlight or chemicals, like grass. A consumer (heterotroph) eats other living or once-living things, like a rabbit."}]}, {"id": "n2", "date": "2026-11-15", "label": "Night 2", "day": "Sun, Nov 15", "minutes": "about 40 min, 3 short rounds", "title": "Photosynthesis", "steps": [{"do": "warm", "ref": "2"}, {"do": "lesson", "ref": "L4"}, {"do": "break"}, {"do": "lesson", "ref": "L5"}, {"do": "drill", "ref": "label-chloro"}, {"do": "drill", "ref": "label-flow"}, {"do": "break"}, {"do": "drill", "ref": "eq-photo"}, {"do": "drill", "ref": "draw-chloro"}, {"do": "quiz", "ref": "2"}, {"do": "teach", "ref": "n2"}], "teach": [{"q": "Say the photosynthesis equation. What's each part?", "a": "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂: carbon dioxide plus water makes glucose plus oxygen, with solar energy."}, {"q": "Draw a chloroplast. Show where each stage happens.", "a": "Stage 1, the light-dependent reaction: the grana (thylakoid membrane). Stage 2, the Calvin cycle: the stroma."}, {"q": "What does stage 1 make, and what does stage 2 use it for?", "a": "Stage 1 makes ATP and NADPH (and lets out oxygen). Stage 2 uses them to turn CO₂ into glucose."}]}, {"id": "n3", "date": "2026-11-16", "label": "Night 3", "day": "Mon, Nov 16", "minutes": "about 40 min, 3 short rounds", "title": "Cellular respiration", "steps": [{"do": "warm", "ref": "3"}, {"do": "lesson", "ref": "L6"}, {"do": "break"}, {"do": "lesson", "ref": "L7"}, {"do": "lesson", "ref": "L8"}, {"do": "break"}, {"do": "drill", "ref": "label-mito"}, {"do": "drill", "ref": "eq-resp"}, {"do": "drill", "ref": "draw-mito"}, {"do": "quiz", "ref": "3"}, {"do": "teach", "ref": "n3"}], "teach": [{"q": "Say the cellular respiration equation.", "a": "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP)."}, {"q": "Walk me through it: glycolysis, the Krebs cycle, the ETC. Where does each happen, and what does it make?", "a": "Glycolysis: cytoplasm, glucose → 2 pyruvate, 2 ATP, 2 NADH. Krebs: matrix, CO₂ and 2 ATP (plus NADH and FADH₂). ETC: inner membrane, 34 ATP and water."}, {"q": "What happens when there's no oxygen?", "a": "Fermentation: lactic acid (muscles, some bacteria) or alcohol + CO₂ (yeast). Only 2-4 ATP."}]}, {"id": "n4", "date": "2026-11-17", "label": "Night 4", "day": "Tue, Nov 17", "minutes": "about 45 min, 3 short rounds", "title": "Put it together", "steps": [{"do": "warm", "ref": "4"}, {"do": "lesson", "ref": "L9"}, {"do": "drill", "ref": "draw-cycle"}, {"do": "break"}, {"do": "traps"}, {"do": "quiz", "ref": "all"}, {"do": "teach", "ref": "n4"}, {"do": "break"}, {"do": "test", "ref": "A"}], "teach": [{"q": "How are photosynthesis and cellular respiration connected?", "a": "The products of one are the reactants of the other. Glucose and O₂ go to respiration; CO₂ and H₂O go back to photosynthesis."}, {"q": "Which one is endothermic, and which is exothermic? Why?", "a": "Photosynthesis is endothermic: it takes in light energy. Respiration is exothermic: it gives off energy."}, {"q": "NADH or NADPH: which goes with which?", "a": "NADPH: photosynthesis. NADH: cellular respiration."}]}, {"id": "n5", "date": "2026-11-18", "label": "Night 5", "day": "Wed, Nov 18", "minutes": "about 35 min", "title": "Dad's test", "steps": [{"do": "warm", "ref": "5"}, {"do": "text", "text": "Take Practice Test B on paper with Dad. No notes, about 20 minutes."}, {"do": "text", "text": "Go over every miss with Dad. Say the right answer out loud and why."}, {"do": "break"}, {"do": "flash", "ref": "star"}, {"do": "tips"}]}, {"id": "n6", "date": "2026-11-19", "label": "Test morning", "day": "Thu, Nov 19", "minutes": "5-10 min", "title": "Quick warm-up", "steps": [{"do": "warm", "ref": "6"}, {"do": "drill", "ref": "eq-photo"}, {"do": "drill", "ref": "eq-resp"}, {"do": "tips"}]}], "lessons": [{"id": "L1", "night": 1, "title": "Producers and consumers", "cards": [{"head": "All energy starts with the sun", "body": "Living things need energy all the time. For most life on Earth, that energy starts with the sun.", "hook": "Sun → producers → consumers.", "recall": {"q": "Where does the energy for most life on Earth start?", "a": "The sun."}}, {"head": "Producers make their own food", "body": "Producers are also called autotrophs. They get energy from nonliving things, like sunlight or chemicals. Examples: plants, algae, some bacteria.", "hook": "Auto means self. Autotrophs feed themselves.", "recall": {"q": "What's another name for a producer? Where does it get energy?", "a": "An autotroph. From nonliving things, like sunlight or chemicals."}}, {"head": "Consumers eat other living things", "body": "Consumers are also called heterotrophs. They get energy from living or once-living things. Examples: animals, fungi, most bacteria.", "hook": "Hetero means other. Heterotrophs eat others.", "recall": {"q": "What's another name for a consumer?", "a": "A heterotroph."}}, {"head": "Consumers break food down for ATP", "body": "Consumers break down the food they eat to release ATP. That process is called cellular respiration.", "hook": "Eat it, break it down, get ATP.", "recall": {"q": "What's it called when a consumer breaks down food to release ATP?", "a": "Cellular respiration."}}, {"head": "Two ways producers get energy", "body": "Photosynthesis uses sunlight. Chemosynthesis uses chemicals, like sulfur and methane. Both use nonliving sources.", "hook": "Photo means light. Chemo means chemicals.", "visual": {"type": "table", "head": ["", "Photosynthesis", "Chemosynthesis"], "rows": [["Energy source", "Sunlight", "Chemicals (sulfur, methane)"], ["Examples", "Plants, cyanobacteria", "Deep-sea vent bacteria"], ["Equation", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "6CO₂ + 18H₂S + 3O₂ → C₆H₁₂O₆ + 12H₂O + 18S"], ["Same in both", "Nonliving energy source", "Nonliving energy source"]]}, "recall": {"q": "Photosynthesis uses sunlight. What does chemosynthesis use?", "a": "Chemicals, like sulfur and methane."}}, {"head": "Who uses chemosynthesis", "body": "Producers that can't use sunlight make food from chemicals instead. Example: bacteria at deep-sea vents, where no light reaches.", "hook": "Same goal (make glucose), different power source.", "recall": {"q": "Who uses chemosynthesis?", "a": "Producers that can't use sunlight, like bacteria at deep-sea vents."}}, {"head": "Four kinds of consumers", "body": "Herbivores eat only plants. Carnivores eat only meat. Omnivores eat both. Detritivores (decomposers) eat dead material.", "hook": "Herb = plants. Carn = meat. Omni = all. Detritivores are the clean-up crew.", "recall": {"q": "Name the four kinds of consumers.", "a": "Herbivore, carnivore, omnivore and detritivore (decomposer)."}}], "check": [{"q": "What's another name for a producer?", "a": "An autotroph."}, {"q": "Name the four kinds of consumers.", "a": "Herbivore, carnivore, omnivore and detritivore (decomposer)."}, {"q": "Where do deep-sea vent bacteria get their energy?", "a": "From chemicals like sulfur and methane (chemosynthesis)."}]}, {"id": "L2", "night": 1, "title": "Food chains and the Rule of 10", "cards": [{"head": "A food chain is one path", "body": "A food chain follows one path of energy. Each arrow points from the food to the eater.", "hook": "Read an arrow as \"is eaten by.\"", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 250\" role=\"img\" aria-label=\"Food chain: grass, grasshopper, mouse, owl\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-ch1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><rect x=\"66.0\" y=\"17\" width=\"52\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"92\" y=\"34.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Owl<\/text><text x=\"178\" y=\"34.5\" class=\"dg-tm\" font-size=\"12.5\" text-anchor=\"start\">4  Tertiary consumer<\/text><rect x=\"64.5\" y=\"79\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"92\" y=\"96.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Mouse<\/text><text x=\"178\" y=\"96.5\" class=\"dg-tm\" font-size=\"12.5\" text-anchor=\"start\">3  Secondary consumer<\/text><rect x=\"42.3\" y=\"141\" width=\"99.4\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"92\" y=\"158.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grasshopper<\/text><text x=\"178\" y=\"158.5\" class=\"dg-tm\" font-size=\"12.5\" text-anchor=\"start\">2  Primary consumer<\/text><rect x=\"64.5\" y=\"203\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"92\" y=\"220.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grass<\/text><text x=\"178\" y=\"220.5\" class=\"dg-tm\" font-size=\"12.5\" text-anchor=\"start\">1  Producer<\/text><line x1=\"92.0\" y1=\"77.0\" x2=\"92.0\" y2=\"47.0\" class=\"dg-arrow\" marker-end=\"url(#ah-ch1)\"/><line x1=\"92.0\" y1=\"139.0\" x2=\"92.0\" y2=\"109.0\" class=\"dg-arrow\" marker-end=\"url(#ah-ch1)\"/><line x1=\"92.0\" y1=\"201.0\" x2=\"92.0\" y2=\"171.0\" class=\"dg-arrow\" marker-end=\"url(#ah-ch1)\"/><text class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\"><tspan x=\"30\" y=\"121.4\">energy<\/tspan><tspan x=\"30\" y=\"134.6\">flows up<\/tspan><\/text><\/svg>"}, "recall": {"q": "Which way does a food chain arrow point?", "a": "From the food to the eater, the way the energy moves."}}, {"head": "Trophic levels are feeding steps", "body": "Level 1 is the producer. Level 2 is the primary consumer, level 3 the secondary, level 4 the tertiary.", "hook": "Count from the plant. Primary, secondary, tertiary = 1st, 2nd, 3rd eater.", "recall": {"q": "What level is the primary consumer on?", "a": "Level 2. The producer is level 1."}}, {"head": "The Rule of 10", "body": "Only about 10% of the energy moves up to the next level. The other 90% is used to stay alive (metabolism) or lost as heat.", "hook": "10% moves up. 90% is used or lost as heat.", "recall": {"q": "What happens to the 90% that doesn't move up?", "a": "It's used for metabolism (staying alive) or lost as heat."}}, {"head": "Do the math", "body": "Divide by 10 for each step up: 1,800 → 180 → 18 → 1.8 calories. As percents: 100%, 10%, 1%, 0.1%.", "hook": "Going up: divide by 10. Going down: multiply by 10.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 250\" role=\"img\" aria-label=\"Energy pyramid with 1,800 calories at the bottom\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-py1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><polygon points=\"30.0,232.0 270.0,232.0 240.0,177.5 60.0,177.5\" class=\"dg-leaf\"/><text x=\"150\" y=\"209.25\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grass<\/text><text x=\"238.0\" y=\"205.75\" class=\"dg-tm\" font-size=\"11.5\" text-anchor=\"start\">1  Producer<\/text><text x=\"238.0\" y=\"219.75\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">100%  ·  1,800 cal<\/text><polygon points=\"60.0,177.5 240.0,177.5 210.0,123.0 90.0,123.0\" class=\"dg-cell\"/><text x=\"150\" y=\"154.75\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grasshopper<\/text><text x=\"238.0\" y=\"151.25\" class=\"dg-tm\" font-size=\"11.5\" text-anchor=\"start\">2  Primary<\/text><text x=\"238.0\" y=\"165.25\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">10%  ·  180 cal<\/text><polygon points=\"90.0,123.0 210.0,123.0 180.0,68.5 120.0,68.5\" class=\"dg-box\"/><text x=\"150\" y=\"100.25\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Mouse<\/text><text x=\"238.0\" y=\"96.75\" class=\"dg-tm\" font-size=\"11.5\" text-anchor=\"start\">3  Secondary<\/text><text x=\"238.0\" y=\"110.75\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">1%  ·  18 cal<\/text><polygon points=\"120.0,68.5 180.0,68.5 150.0,14.0 150.0,14.0\" class=\"dg-cell\"/><text x=\"150\" y=\"50.25\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Owl<\/text><text x=\"238.0\" y=\"42.25\" class=\"dg-tm\" font-size=\"11.5\" text-anchor=\"start\">4  Tertiary<\/text><text x=\"238.0\" y=\"56.25\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">0.1%  ·  1.8 cal<\/text><\/svg>"}, "recall": {"q": "The plant has 1,800 calories. How many reach the secondary consumer?", "a": "18 calories (1,800 → 180 → 18)."}}, {"head": "Food webs", "body": "A food web shows many food chains at once and how they connect. Most animals eat more than one thing.", "hook": "Chain = one path. Web = many paths.", "recall": {"q": "What's the difference between a food chain and a food web?", "a": "A chain is one path. A web shows many chains at once and how they connect."}}, {"head": "Three kinds of pyramids", "body": "Energy pyramid: the energy at each level (always smaller going up). Numbers pyramid: how many organisms. Biomass pyramid: the total mass of living matter.", "hook": "Each pyramid's name says what it measures.", "recall": {"q": "What does a biomass pyramid show?", "a": "The total mass of living matter at each level."}}, {"head": "Why the top is small", "body": "Energy shrinks going up, so fewer organisms can live at the top. Lots of grass, a few owls.", "hook": "Less energy at the top = fewer animals at the top.", "recall": {"q": "Why does a numbers pyramid get smaller going up?", "a": "Energy decreases going up, so fewer organisms can be supported."}}], "check": [{"q": "Grass has 5,000 calories. How many reach the secondary consumer?", "a": "50 calories (5,000 → 500 → 50)."}, {"q": "What happens to the other 90% of the energy?", "a": "It's used for metabolism or lost as heat."}, {"q": "What does a numbers pyramid show?", "a": "The number of organisms at each trophic level."}]}, {"id": "L3", "night": 1, "title": "Reading a food web", "cards": [{"head": "Follow the arrows", "body": "In a food web, an arrow goes from the food to the eater. Energy flows one way only: the grass never eats the rabbit.", "hook": "Arrows point where the energy goes.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 305\" role=\"img\" aria-label=\"Practice food web: grass, berry bush, rabbit, grasshopper, mouse, frog, snake, hawk\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-w1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><line x1=\"77.1\" y1=\"267.0\" x2=\"51.3\" y2=\"135.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"98.6\" y1=\"267.0\" x2=\"140.9\" y2=\"233.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"280.8\" y1=\"267.0\" x2=\"273.4\" y2=\"179.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"192.6\" y1=\"201.0\" x2=\"240.5\" y2=\"177.5\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"151.3\" y1=\"201.0\" x2=\"124.1\" y2=\"163.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"267.9\" y1=\"147.0\" x2=\"256.6\" y2=\"105.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"140.0\" y1=\"134.4\" x2=\"220.5\" y2=\"101.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"69.3\" y1=\"103.0\" x2=\"155.9\" y2=\"42.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"234.9\" y1=\"73.0\" x2=\"199.4\" y2=\"42.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><rect x=\"154.0\" y=\"12\" width=\"52\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"180\" y=\"29.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Hawk<\/text><rect x=\"224.5\" y=\"75\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"252\" y=\"92.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Snake<\/text><rect x=\"16.799999999999997\" y=\"105\" width=\"62.400000000000006\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"48\" y=\"122.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Rabbit<\/text><rect x=\"86.0\" y=\"133\" width=\"52\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"112\" y=\"150.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Frog<\/text><rect x=\"244.5\" y=\"149\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"272\" y=\"166.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Mouse<\/text><rect x=\"112.3\" y=\"203\" width=\"99.4\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"162\" y=\"220.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grasshopper<\/text><rect x=\"52.5\" y=\"269\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"80\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grass<\/text><rect x=\"236.0\" y=\"269\" width=\"92.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"282\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Berry bush<\/text><\/svg>", "caption": "Practice web. Green boxes are producers."}, "recall": {"q": "Why does energy flow only one way?", "a": "The eater eats the food, never the other way around. The grass doesn't eat the rabbit."}}, {"head": "Count the food chains", "body": "Start at each producer. Follow every path to an animal nothing eats. Each full path is one chain. This web has 4.", "hook": "Trace each path with your finger and count.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 305\" role=\"img\" aria-label=\"Practice food web: grass, berry bush, rabbit, grasshopper, mouse, frog, snake, hawk\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-w1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><line x1=\"77.1\" y1=\"267.0\" x2=\"51.3\" y2=\"135.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"98.6\" y1=\"267.0\" x2=\"140.9\" y2=\"233.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"280.8\" y1=\"267.0\" x2=\"273.4\" y2=\"179.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"192.6\" y1=\"201.0\" x2=\"240.5\" y2=\"177.5\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"151.3\" y1=\"201.0\" x2=\"124.1\" y2=\"163.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"267.9\" y1=\"147.0\" x2=\"256.6\" y2=\"105.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"140.0\" y1=\"134.4\" x2=\"220.5\" y2=\"101.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"69.3\" y1=\"103.0\" x2=\"155.9\" y2=\"42.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><line x1=\"234.9\" y1=\"73.0\" x2=\"199.4\" y2=\"42.0\" class=\"dg-arrow\" marker-end=\"url(#ah-w1)\"/><rect x=\"154.0\" y=\"12\" width=\"52\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"180\" y=\"29.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Hawk<\/text><rect x=\"224.5\" y=\"75\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"252\" y=\"92.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Snake<\/text><rect x=\"16.799999999999997\" y=\"105\" width=\"62.400000000000006\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"48\" y=\"122.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Rabbit<\/text><rect x=\"86.0\" y=\"133\" width=\"52\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"112\" y=\"150.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Frog<\/text><rect x=\"244.5\" y=\"149\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"272\" y=\"166.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Mouse<\/text><rect x=\"112.3\" y=\"203\" width=\"99.4\" height=\"26\" rx=\"13\" class=\"dg-box\"/><text x=\"162\" y=\"220.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grasshopper<\/text><rect x=\"52.5\" y=\"269\" width=\"55.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"80\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grass<\/text><rect x=\"236.0\" y=\"269\" width=\"92.0\" height=\"26\" rx=\"13\" class=\"dg-leaf\"/><text x=\"282\" y=\"286.5\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Berry bush<\/text><\/svg>"}, "recall": {"q": "How do you count the food chains in a web?", "a": "Start at each producer and follow every path to the top. Each full path is one chain."}}, {"head": "Arrows in = what it eats", "body": "Look at the arrows coming into an animal. That's what it eats. The mouse eats berries and grasshoppers, so it's an omnivore. Most worksheet webs leave out detritivores (decomposers).", "hook": "Arrows in = its menu.", "recall": {"q": "How can you tell what an animal eats in a food web?", "a": "Look at the arrows coming into it."}}, {"head": "Same animal, different levels", "body": "Count levels from the producer. The snake is secondary in berry bush → mouse → snake, and tertiary in grass → grasshopper → mouse → snake.", "hook": "Same animal, different chain, different level.", "recall": {"q": "Can one animal be on more than one trophic level?", "a": "Yes. It depends on which chain you follow."}}, {"head": "\"Which organism(s)\" means check them all", "body": "Check every chain, not just one. In this web the snake and the hawk are both tertiary consumers in at least one chain.", "hook": "Check every chain before you answer.", "recall": {"q": "A question asks \"which organism(s).\" What do you do?", "a": "Check every chain. There can be more than one answer."}}, {"head": "Who's in every chain?", "body": "Check the chains one by one. The hawk is in all 4. Grass isn't, because the berry bush starts one chain.", "hook": "Two producers means no producer is in every chain.", "recall": {"q": "In the practice web, who's in every food chain?", "a": "The hawk."}}], "check": [{"q": "Which type of heterotroph is missing from most worksheet food webs?", "a": "Detritivores (decomposers)."}, {"q": "Why does the hawk get less energy than the snake?", "a": "It's a level higher. Only about 10% passes up each level; the rest is used for metabolism or lost as heat."}]}, {"id": "L4", "night": 2, "title": "Photosynthesis basics", "cards": [{"head": "What photosynthesis does", "body": "Photosynthesis turns sunlight, water and carbon dioxide into glucose, a sugar that stores the energy.", "hook": "Light in, sugar out.", "recall": {"q": "What three things does photosynthesis use?", "a": "Sunlight, water and carbon dioxide."}}, {"head": "The equation (starred for the test)", "body": "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, with solar energy by the arrow. Carbon dioxide plus water makes glucose plus oxygen.", "hook": "Six, six, one, six.", "recall": {"q": "Say the photosynthesis equation.", "a": "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (solar energy by the arrow)."}}, {"head": "Reactants and products", "body": "Reactants go in: CO₂ and H₂O. Products come out: glucose and O₂. Sunlight is needed, but it isn't either one.", "hook": "Reactants = ingredients. Products = results.", "recall": {"q": "What are the products of photosynthesis?", "a": "Glucose (C₆H₁₂O₆) and oxygen (O₂)."}}, {"head": "How the ingredients get in", "body": "Water comes in through the roots. Carbon dioxide comes in through the stomata, tiny openings in the leaves.", "hook": "Roots drink water. Stomata breathe in CO₂.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 270\" role=\"img\" aria-label=\"How the ingredients of photosynthesis get into a plant\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-pl1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><circle cx=\"40\" cy=\"38\" r=\"20\" class=\"dg-sun\"/><line x1=\"64.0\" y1=\"52.0\" x2=\"150.0\" y2=\"98.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pl1)\"/><text x=\"122\" y=\"62\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">light energy<\/text><path d=\"M180,200 C178,160 182,120 180,70\" class=\"dg-stem\"/><path d=\"M180,120 C150,100 128,108 120,124 C140,138 165,134 180,120 z\" class=\"dg-leaf\"/><path d=\"M180,95 C210,75 236,82 244,96 C224,112 198,110 180,95 z\" class=\"dg-leaf\"/><line x1=\"20\" y1=\"200\" x2=\"340\" y2=\"200\" class=\"dg-ground\"/><path d=\"M180,200 C175,220 160,232 148,246\" class=\"dg-root\"/><path d=\"M180,200 C186,222 202,232 214,248\" class=\"dg-root\"/><path d=\"M180,200 L181,248\" class=\"dg-root\"/><line x1=\"330.0\" y1=\"150.0\" x2=\"248.0\" y2=\"104.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pl1)\"/><text class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\"><tspan x=\"300\" y=\"160.8\">CO₂ in through<\/tspan><tspan x=\"300\" y=\"175.2\">the stomata<\/tspan><\/text><line x1=\"122.0\" y1=\"124.0\" x2=\"60.0\" y2=\"150.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pl1)\"/><text x=\"52\" y=\"168\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">O₂ out<\/text><line x1=\"300.0\" y1=\"240.0\" x2=\"222.0\" y2=\"240.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pl1)\"/><text x=\"262\" y=\"262\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">H₂O in through the roots<\/text><text class=\"dg-tm\" font-size=\"11\" text-anchor=\"start\"><tspan x=\"20\" y=\"101.4\">glucose made<\/tspan><tspan x=\"20\" y=\"114.6\">in the leaf<\/tspan><\/text><\/svg>"}, "recall": {"q": "How does CO₂ get into a leaf?", "a": "Through the stomata, tiny openings in the leaf."}}, {"head": "Inside the chloroplast", "body": "Photosynthesis happens in the chloroplast. Grana are stacks of thylakoid membrane. The stroma is the fluid around them.", "hook": "Grana = stacks of pancakes. Stroma = the syrup around them.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 246\" role=\"img\" aria-label=\"Chloroplast: grana, thylakoid membrane, stroma\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-cp1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><ellipse cx=\"180\" cy=\"116\" rx=\"156\" ry=\"88\" class=\"dg-leaf2\"/><ellipse cx=\"180\" cy=\"116\" rx=\"148\" ry=\"80\" class=\"dg-stroma\"/><rect x=\"67\" y=\"83.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"67\" y=\"94.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"67\" y=\"105.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"67\" y=\"116.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"67\" y=\"127.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"67\" y=\"138.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"155\" y=\"77.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"155\" y=\"88.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"155\" y=\"99.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"155\" y=\"110.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"155\" y=\"121.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"155\" y=\"132.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"155\" y=\"143.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"243\" y=\"83.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"243\" y=\"94.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"243\" y=\"105.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"243\" y=\"116.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"243\" y=\"127.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><rect x=\"243\" y=\"138.0\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-thyl\"/><path d=\"M117,110 L155,104 M205,104 L243,110\" class=\"dg-thin\"/><path d=\"M62,83 L62,77 L122,77 L122,83\" class=\"dg-brk\"/><rect x=\"243\" y=\"104.5\" width=\"50\" height=\"9\" rx=\"4.5\" class=\"dg-hi\"/><line x1=\"84\" y1=\"16\" x2=\"92\" y2=\"77\" class=\"dg-lead\"/><circle cx=\"92\" cy=\"77\" r=\"2.6\" class=\"dg-dot\"/><text x=\"84\" y=\"11\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Grana (a whole stack)<\/text><line x1=\"276\" y1=\"24\" x2=\"293\" y2=\"109\" class=\"dg-lead\"/><circle cx=\"293\" cy=\"109\" r=\"2.6\" class=\"dg-dot\"/><text class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\"><tspan x=\"276\" y=\"11.5\">Thylakoid membrane<\/tspan><tspan x=\"276\" y=\"26.5\">(one disc)<\/tspan><\/text><line x1=\"180\" y1=\"224\" x2=\"150\" y2=\"160\" class=\"dg-lead\"/><circle cx=\"150\" cy=\"160\" r=\"2.6\" class=\"dg-dot\"/><text x=\"180\" y=\"238\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Stroma (fluid)<\/text><\/svg>"}, "recall": {"q": "What are the grana? What's the stroma?", "a": "Grana: stacks of thylakoid membrane. Stroma: the fluid around them."}}, {"head": "Chlorophyll catches the light", "body": "Chlorophyll is the green pigment that captures sunlight. It sits in the thylakoid membrane, in the grana.", "hook": "Chlorophyll catches the light.", "recall": {"q": "Where is chlorophyll?", "a": "In the thylakoid membrane, in the grana."}}], "check": [{"q": "Where does CO₂ enter a plant?", "a": "Through the stomata in the leaves."}, {"q": "Is sunlight a reactant?", "a": "No. It's needed, but it isn't a reactant or a product."}, {"q": "Name the two main parts of a chloroplast.", "a": "Grana (stacks of thylakoids) and stroma (the fluid)."}]}, {"id": "L5", "night": 2, "title": "The two stages of photosynthesis", "cards": [{"head": "Two stages", "body": "Stage 1, the light-dependent reaction, needs sunlight. Stage 2, the Calvin cycle (light-independent reaction), doesn't.", "hook": "Stage 1 charges the batteries. Stage 2 spends them.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" aria-label=\"The two stages of photosynthesis\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-pf1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><rect x=\"12\" y=\"112\" width=\"150\" height=\"84\" rx=\"12\" class=\"dg-leaf2\"/><rect x=\"198\" y=\"112\" width=\"150\" height=\"84\" rx=\"12\" class=\"dg-stroma\"/><text class=\"dg-t\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"87\" y=\"130.2\">Light-dependent<\/tspan><tspan x=\"87\" y=\"145.8\">reaction<\/tspan><\/text><text class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\"><tspan x=\"87\" y=\"171.4\">grana (thylakoid<\/tspan><tspan x=\"87\" y=\"184.6\">membrane)<\/tspan><\/text><text x=\"273\" y=\"140\" class=\"dg-t\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">Calvin cycle<\/text><text x=\"273\" y=\"158\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">(light-independent)<\/text><text x=\"273\" y=\"180\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">stroma<\/text><circle cx=\"34\" cy=\"36\" r=\"16\" class=\"dg-sun\"/><line x1=\"50.0\" y1=\"48.0\" x2=\"76.0\" y2=\"108.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pf1)\"/><text x=\"6\" y=\"72\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">sunlight<\/text><line x1=\"120.0\" y1=\"40.0\" x2=\"120.0\" y2=\"108.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pf1)\"/><line x1=\"87.0\" y1=\"200.0\" x2=\"87.0\" y2=\"256.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pf1)\"/><line x1=\"290.0\" y1=\"40.0\" x2=\"290.0\" y2=\"108.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pf1)\"/><line x1=\"273.0\" y1=\"200.0\" x2=\"273.0\" y2=\"256.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pf1)\"/><line x1=\"164.0\" y1=\"140.0\" x2=\"194.0\" y2=\"140.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pf1)\"/><line x1=\"196.0\" y1=\"172.0\" x2=\"166.0\" y2=\"172.0\" class=\"dg-arrow\" marker-end=\"url(#ah-pf1)\"/><text x=\"180\" y=\"100\" class=\"dg-t\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">ATP + NADPH →<\/text><text x=\"180\" y=\"218\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">← ADP + NADP⁺<\/text><text x=\"120\" y=\"30\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">H₂O (water)<\/text><text x=\"87\" y=\"276\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">O₂ (oxygen) out<\/text><text x=\"290\" y=\"30\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">CO₂ in<\/text><text x=\"273\" y=\"276\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">C₆H₁₂O₆ (glucose)<\/text><\/svg>"}, "recall": {"q": "What are the two stages of photosynthesis called?", "a": "The light-dependent reaction and the Calvin cycle (light-independent reaction)."}}, {"head": "Stage 1 happens where the light is caught", "body": "The light-dependent reaction happens in the grana, on the thylakoid membrane, where the chlorophyll is.", "hook": "Light-dependent depends on light, so it happens where the chlorophyll is.", "recall": {"q": "Where does the light-dependent reaction happen?", "a": "In the grana, on the thylakoid membrane."}}, {"head": "Stage 1 splits water", "body": "Water is split into hydrogen and oxygen. The oxygen is let out as a waste product.", "hook": "Water in, oxygen out.", "recall": {"q": "Where does the oxygen from photosynthesis come from?", "a": "From splitting water in stage 1. It's let out as waste."}}, {"head": "Stage 1 makes ATP and NADPH", "body": "The sun's energy is passed down an electron transport chain and stored in ATP and NADPH. They move to the stroma for stage 2.", "hook": "P for Photosynthesis: NADPH. The ETC is inside stage 1, but stage 1's name is the light-dependent reaction.", "recall": {"q": "What two energy carriers does stage 1 make?", "a": "ATP and NADPH."}}, {"head": "Stage 2: the Calvin cycle", "body": "The Calvin cycle happens in the stroma. It needs no sunlight, so it's also called the light-independent reaction.", "hook": "Calvin lives in the stroma.", "recall": {"q": "Where does the Calvin cycle happen?", "a": "In the stroma."}}, {"head": "Stage 2 builds glucose", "body": "ATP and NADPH power the Calvin cycle. It joins hydrogen (from water) with carbon dioxide to make glucose.", "hook": "CO₂ in, glucose out.", "recall": {"q": "What goes into the Calvin cycle, and what comes out?", "a": "CO₂, ATP and NADPH go in. Glucose comes out."}}, {"head": "The table to know", "body": "This table answers most photosynthesis questions.", "visual": {"type": "table", "head": ["Stage", "Where", "Goes in", "Comes out"], "rows": [["1. Light-dependent reaction", "Grana (thylakoid membrane)", "Sunlight, water", "Oxygen, ATP, NADPH"], ["2. Calvin cycle (light-independent)", "Stroma", "CO₂, ATP, NADPH", "Glucose"]]}, "recall": {"q": "Stage 1: where is it, what goes in, what comes out?", "a": "Grana (thylakoid membrane). Sunlight and water go in. Oxygen, ATP and NADPH come out."}}, {"head": "Photosynthesis is endothermic", "body": "Endothermic means it takes in energy. Photosynthesis takes in light energy and stores it in glucose.", "hook": "Endo = in. Photosynthesis pulls energy in.", "recall": {"q": "Is photosynthesis endothermic or exothermic?", "a": "Endothermic. It takes energy in."}}], "check": [{"q": "Which stage makes oxygen?", "a": "The light-dependent reaction (stage 1), when water is split."}, {"q": "Where does the Calvin cycle happen?", "a": "In the stroma."}, {"q": "What two energy carriers does stage 1 make?", "a": "ATP and NADPH."}]}, {"id": "L6", "night": 3, "title": "Cellular respiration and glycolysis", "cards": [{"head": "Why cells do it", "body": "Cellular respiration turns the energy in food (glucose) into ATP, the energy cells can use. Carbohydrates go first, but any food can be broken down.", "hook": "Food in, ATP out.", "recall": {"q": "What's the goal of cellular respiration?", "a": "Turn the energy in food (glucose) into ATP."}}, {"head": "The equation", "body": "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP). It's photosynthesis flipped around.", "hook": "Don't drop the 6H₂O.", "recall": {"q": "Say the cellular respiration equation.", "a": "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP)."}}, {"head": "Reactants and products", "body": "Reactants go in: glucose and O₂. Products come out: CO₂ and H₂O. ATP is released, but it isn't counted as a product.", "hook": "Same molecules as photosynthesis, on the other sides.", "recall": {"q": "What are the reactants of cellular respiration?", "a": "Glucose (C₆H₁₂O₆) and oxygen (O₂)."}}, {"head": "Inside the mitochondria", "body": "Cellular respiration happens in the mitochondria. The inner membrane is the folds. The matrix is the fluid inside.", "hook": "Folds = inner membrane. Fluid = matrix.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 246\" role=\"img\" aria-label=\"Mitochondrion: inner membrane, matrix, cytoplasm outside\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-mt1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><ellipse cx=\"180\" cy=\"116\" rx=\"156\" ry=\"86\" class=\"dg-mito\"/><ellipse cx=\"180\" cy=\"116\" rx=\"145\" ry=\"75\" class=\"dg-matrix\"/><path d=\"M61,69.13505958355728 L61,136 Q70,150 79,136 L79,69.13505958355728\" class=\"dg-crista\"/><path d=\"M101,179.68150913379463 L101,96 Q110,82 119,96 L119,179.68150913379463\" class=\"dg-crista\"/><path d=\"M141,44.62278814252876 L141,136 Q150,150 159,136 L159,44.62278814252876\" class=\"dg-crista\"/><path d=\"M181,188.8214283180488 L181,96 Q190,82 199,96 L199,188.8214283180488\" class=\"dg-crista\"/><path d=\"M221,47.60004695439898 L221,136 Q230,150 239,136 L239,47.60004695439898\" class=\"dg-crista\"/><path d=\"M261,172.80422586673484 L261,96 Q270,82 279,96 L279,172.80422586673484\" class=\"dg-crista\"/><line x1=\"92\" y1=\"16\" x2=\"141\" y2=\"72\" class=\"dg-lead\"/><circle cx=\"141\" cy=\"72\" r=\"2.6\" class=\"dg-dot\"/><text x=\"92\" y=\"11\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Inner membrane (folds)<\/text><line x1=\"196\" y1=\"224\" x2=\"210\" y2=\"120\" class=\"dg-lead\"/><circle cx=\"210\" cy=\"120\" r=\"2.6\" class=\"dg-dot\"/><text x=\"196\" y=\"238\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Matrix (fluid)<\/text><line x1=\"290\" y1=\"16\" x2=\"330\" y2=\"50\" class=\"dg-lead\"/><circle cx=\"330\" cy=\"50\" r=\"2.6\" class=\"dg-dot\"/><text x=\"290\" y=\"11\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">Cytoplasm (outside)<\/text><\/svg>"}, "recall": {"q": "What are the two main parts of the mitochondria?", "a": "The inner membrane (the folds) and the matrix (the fluid)."}}, {"head": "Glycolysis splits glucose", "body": "Glycolysis is the first stage. It splits the 6-carbon glucose in half: 2 three-carbon molecules called pyruvate.", "hook": "Glyco = sugar, lysis = split. 6 carbons → 3 + 3.", "recall": {"q": "What does glycolysis split glucose into?", "a": "2 pyruvate (3-carbon molecules)."}}, {"head": "Glycolysis happens outside the mitochondria", "body": "Glycolysis happens in the cytoplasm. It needs no oxygen, so it's anaerobic.", "hook": "Glycolysis happens in the cytoplasm, before pyruvate goes into the mitochondria.", "recall": {"q": "Where does glycolysis happen? Does it need oxygen?", "a": "In the cytoplasm. No oxygen needed: it's anaerobic."}}, {"head": "What glycolysis makes", "body": "Glycolysis makes 2 ATP and 2 NADH, along with the 2 pyruvate.", "hook": "No P in respiration: NADH. P for Photosynthesis: NADPH.", "recall": {"q": "Besides pyruvate, what does glycolysis make?", "a": "2 ATP and 2 NADH."}}, {"head": "Respiration is exothermic", "body": "Exothermic means it gives off energy. Cellular respiration releases the energy stored in glucose.", "hook": "Exo = out, like exit. The energy comes out.", "recall": {"q": "Is cellular respiration endothermic or exothermic?", "a": "Exothermic. Energy comes out."}}], "check": [{"q": "Where does glycolysis happen?", "a": "In the cytoplasm."}, {"q": "What does glycolysis split glucose into?", "a": "2 pyruvate (3-carbon molecules)."}, {"q": "What's the matrix?", "a": "The fluid-like substance that fills the space inside the mitochondria."}]}, {"id": "L7", "night": 3, "title": "With oxygen: Krebs cycle and ETC", "cards": [{"head": "Decision time", "body": "After glycolysis, the cell checks for oxygen. Oxygen: aerobic respiration (2 steps). No oxygen: anaerobic respiration (fermentation).", "hook": "O₂ yes: aerobic. O₂ no: anaerobic.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 440\" role=\"img\" aria-label=\"Cellular respiration road map\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-rm1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><rect x=\"110\" y=\"8\" width=\"140\" height=\"30\" rx=\"15\" class=\"dg-box\"/><text x=\"180\" y=\"28\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">Glucose  C₆H₁₂O₆<\/text><line x1=\"180.0\" y1=\"40.0\" x2=\"180.0\" y2=\"58.0\" class=\"dg-arrow\" marker-end=\"url(#ah-rm1)\"/><rect x=\"60\" y=\"60\" width=\"240\" height=\"50\" rx=\"10\" class=\"dg-cell\"/><text x=\"180\" y=\"80\" class=\"dg-t\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">Glycolysis  (cytoplasm)<\/text><text x=\"180\" y=\"99\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">no O₂ needed · makes 2 ATP + 2 NADH<\/text><line x1=\"180.0\" y1=\"112.0\" x2=\"180.0\" y2=\"130.0\" class=\"dg-arrow\" marker-end=\"url(#ah-rm1)\"/><rect x=\"120\" y=\"132\" width=\"120\" height=\"28\" rx=\"14\" class=\"dg-box\"/><text x=\"180\" y=\"151\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">2 pyruvate<\/text><line x1=\"150.0\" y1=\"162.0\" x2=\"90.0\" y2=\"194.0\" class=\"dg-arrow\" marker-end=\"url(#ah-rm1)\"/><line x1=\"210.0\" y1=\"162.0\" x2=\"270.0\" y2=\"194.0\" class=\"dg-arrow\" marker-end=\"url(#ah-rm1)\"/><text x=\"76\" y=\"182\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">O₂ present<\/text><text x=\"290\" y=\"182\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">no O₂<\/text><rect x=\"8\" y=\"198\" width=\"166\" height=\"56\" rx=\"10\" class=\"dg-mito\"/><text x=\"91\" y=\"218\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">Krebs (citric acid) cycle<\/text><text x=\"91\" y=\"234\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">matrix · 2 ATP<\/text><text x=\"91\" y=\"248\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">CO₂ out · NADH, FADH₂<\/text><line x1=\"91.0\" y1=\"256.0\" x2=\"91.0\" y2=\"274.0\" class=\"dg-arrow\" marker-end=\"url(#ah-rm1)\"/><rect x=\"8\" y=\"276\" width=\"166\" height=\"56\" rx=\"10\" class=\"dg-mito\"/><text x=\"91\" y=\"296\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">Electron transport chain<\/text><text x=\"91\" y=\"312\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">inner membrane · 34 ATP<\/text><text x=\"91\" y=\"326\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">O₂ in · H₂O out<\/text><line x1=\"91.0\" y1=\"334.0\" x2=\"91.0\" y2=\"352.0\" class=\"dg-arrow\" marker-end=\"url(#ah-rm1)\"/><rect x=\"8\" y=\"354\" width=\"166\" height=\"40\" rx=\"10\" class=\"dg-leaf\"/><text x=\"91\" y=\"379\" class=\"dg-t\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">Aerobic: 36-38 ATP<\/text><rect x=\"186\" y=\"198\" width=\"166\" height=\"56\" rx=\"10\" class=\"dg-box\"/><text x=\"269\" y=\"218\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">Lactic acid<\/text><text x=\"269\" y=\"234\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">muscles, some bacteria<\/text><text x=\"269\" y=\"248\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">+ 2 ATP<\/text><rect x=\"186\" y=\"262\" width=\"166\" height=\"56\" rx=\"10\" class=\"dg-box\"/><text x=\"269\" y=\"282\" class=\"dg-t\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">Alcohol + CO₂<\/text><text x=\"269\" y=\"298\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">yeast<\/text><text x=\"269\" y=\"312\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">+ 2 ATP<\/text><text x=\"269\" y=\"340\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">(fermentation)<\/text><rect x=\"186\" y=\"354\" width=\"166\" height=\"40\" rx=\"10\" class=\"dg-cell\"/><text x=\"269\" y=\"379\" class=\"dg-t\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">Anaerobic: 2-4 ATP<\/text><text x=\"180\" y=\"424\" class=\"dg-tm\" font-size=\"11.5\" text-anchor=\"middle\">Most ATP comes from the electron transport chain.<\/text><\/svg>"}, "recall": {"q": "There's no oxygen. What does the cell do after glycolysis?", "a": "Anaerobic respiration (fermentation)."}}, {"head": "Aerobic step 1: the Krebs cycle", "body": "The Krebs cycle (also called the citric acid cycle) happens in the matrix. It uses the 2 pyruvate from glycolysis.", "hook": "Krebs in the matrix: pyruvate in.", "recall": {"q": "What does the Krebs cycle use, and where is it?", "a": "Pyruvate. In the matrix."}}, {"head": "What the Krebs cycle makes", "body": "The Krebs cycle makes 2 ATP, plus NADH and FADH₂. CO₂ is let out as a waste product.", "hook": "Krebs: CO₂ out, and 2 ATP.", "recall": {"q": "What does the Krebs cycle make?", "a": "2 ATP, NADH and FADH₂. CO₂ is let out as waste."}}, {"head": "Aerobic step 2: the electron transport chain", "body": "The ETC is on the inner membrane. It uses the electrons and hydrogens from the Krebs cycle, carried by NADH and FADH₂.", "hook": "ETC on the folds.", "recall": {"q": "Where is the electron transport chain?", "a": "On the inner membrane of the mitochondria."}}, {"head": "The ETC makes the most ATP", "body": "The ETC makes 34 ATP and water. Most of the ATP comes from this step.", "hook": "34 ATP: the big payday.", "recall": {"q": "What does the ETC make?", "a": "34 ATP and water."}}, {"head": "Where oxygen fits", "body": "Oxygen is used at the very end, in the ETC. It grabs the hydrogens and becomes water.", "hook": "Oxygen + hydrogen = water.", "recall": {"q": "What does oxygen do in the ETC?", "a": "It grabs the hydrogens and becomes water."}}, {"head": "Add it up", "body": "2 ATP from glycolysis + 2 from the Krebs cycle + 34 from the ETC. Your notes give the total as 36-38 ATP.", "hook": "2 + 2 + 34 = 38. Your notes give a range: write 36-38.", "recall": {"q": "How much ATP does aerobic respiration make in all?", "a": "36-38 ATP."}}, {"head": "The table to know", "body": "Each step: where it happens, what goes in, what comes out.", "visual": {"type": "table", "head": ["Step", "Where", "Uses", "Makes"], "rows": [["Glycolysis", "Cytoplasm", "Glucose", "2 pyruvate, 2 ATP, 2 NADH"], ["1. Krebs (citric acid) cycle", "Matrix", "Pyruvate", "CO₂, 2 ATP, NADH, FADH₂"], ["2. Electron transport chain", "Inner membrane", "Hydrogens (from NADH, FADH₂) and O₂", "34 ATP and H₂O"]]}, "recall": {"q": "Glycolysis, Krebs cycle, ETC: where is each one?", "a": "Glycolysis: cytoplasm. Krebs cycle: matrix. ETC: inner membrane."}}], "check": [{"q": "What does the Krebs cycle use?", "a": "Pyruvate from glycolysis."}, {"q": "Which step makes the most ATP?", "a": "The electron transport chain: 34 ATP."}, {"q": "Where is the ETC?", "a": "The inner membrane of the mitochondria."}]}, {"id": "L8", "night": 3, "title": "No oxygen: fermentation", "cards": [{"head": "No oxygen: fermentation", "body": "Without oxygen, a cell goes through anaerobic respiration, a process called fermentation. There are two kinds: lactic acid and alcohol.", "hook": "No O₂ → fermentation.", "recall": {"q": "What are the two kinds of fermentation?", "a": "Lactic acid fermentation and alcohol fermentation."}}, {"head": "Lactic acid fermentation", "body": "Happens in animal cells, like your muscles, and in some bacteria. Pyruvate becomes lactic acid and 2 ATP.", "hook": "Sprint hard: your muscles run short on oxygen and make lactic acid.", "recall": {"q": "Where does lactic acid fermentation happen?", "a": "In animal cells, like your muscles, and in some bacteria."}}, {"head": "Alcohol fermentation", "body": "Happens in yeast when there's no oxygen. Pyruvate becomes alcohol, CO₂ and 2 ATP.", "hook": "The CO₂ from yeast makes bread rise.", "recall": {"q": "What does alcohol fermentation make?", "a": "Alcohol, CO₂ and 2 ATP."}}, {"head": "Aerobic vs. anaerobic", "body": "With oxygen a cell gets far more ATP: 36-38 instead of 2-4. Use your class numbers.", "hook": "Oxygen = way more ATP.", "visual": {"type": "table", "head": ["", "Aerobic (O₂)", "Anaerobic (no O₂)"], "rows": [["Total ATP", "36-38", "2-4"], ["Where it comes from", "2 glycolysis + 2 Krebs + 34 ETC", "2 glycolysis + 2 fermentation"], ["Ends with", "CO₂ and H₂O", "Lactic acid, or alcohol + CO₂"]]}, "recall": {"q": "How much ATP does anaerobic respiration make?", "a": "2-4 ATP. Your notes give a range (2 from glycolysis + 2 from fermentation)."}}], "check": [{"q": "Where does lactic acid fermentation happen?", "a": "In some bacteria and in animal cells, like muscles."}, {"q": "What does alcohol fermentation make?", "a": "Alcohol, CO₂ and 2 ATP."}, {"q": "How much ATP does aerobic respiration make?", "a": "36-38 ATP."}]}, {"id": "L9", "night": 4, "title": "Two processes, one cycle", "cards": [{"head": "They run in a circle", "body": "Photosynthesis makes glucose and O₂. Cellular respiration uses them and makes CO₂ and H₂O, which photosynthesis uses again.", "hook": "One's output is the other's input.", "visual": {"type": "svg", "svg": "<svg class=\"dg\" viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"Photosynthesis and cellular respiration form a cycle\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah-cy1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"dg-head\"/><\/marker><\/defs><ellipse cx=\"78\" cy=\"120\" rx=\"64\" ry=\"40\" class=\"dg-leaf2\"/><text x=\"78\" y=\"116\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">Chloroplast<\/text><text x=\"78\" y=\"133\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">photosynthesis<\/text><ellipse cx=\"282\" cy=\"120\" rx=\"64\" ry=\"40\" class=\"dg-mito\"/><text x=\"282\" y=\"116\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">Mitochondria<\/text><text x=\"282\" y=\"133\" class=\"dg-tm\" font-size=\"11\" text-anchor=\"middle\">cellular respiration<\/text><path d=\"M120,88 Q180,40 240,88\" class=\"dg-arrow\" marker-end=\"url(#ah-cy1)\"/><text x=\"180\" y=\"46\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">C₆H₁₂O₆ + O₂<\/text><path d=\"M240,152 Q180,200 120,152\" class=\"dg-arrow\" marker-end=\"url(#ah-cy1)\"/><text x=\"180\" y=\"206\" class=\"dg-t\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"700\">CO₂ + H₂O<\/text><circle cx=\"24\" cy=\"30\" r=\"14\" class=\"dg-sun\"/><line x1=\"34.0\" y1=\"42.0\" x2=\"52.0\" y2=\"80.0\" class=\"dg-arrow\" marker-end=\"url(#ah-cy1)\"/><text x=\"48\" y=\"22\" class=\"dg-t\" font-size=\"11\" text-anchor=\"start\" font-weight=\"600\">light energy<\/text><line x1=\"330.0\" y1=\"150.0\" x2=\"344.0\" y2=\"196.0\" class=\"dg-arrow\" marker-end=\"url(#ah-cy1)\"/><text x=\"318\" y=\"222\" class=\"dg-t\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">ATP energy<\/text><\/svg>"}, "recall": {"q": "What does cellular respiration hand back to photosynthesis?", "a": "CO₂ and H₂O."}}, {"head": "Where each one happens", "body": "Photosynthesis happens in the chloroplast. Cellular respiration happens in the mitochondria.", "hook": "Chloro = green, like the plant. Mitochondria = the cell's powerhouse.", "recall": {"q": "Where does each process happen?", "a": "Photosynthesis: the chloroplast. Cellular respiration: the mitochondria."}}, {"head": "Grass and a cow", "body": "The grass makes glucose and oxygen. The cow eats the grass and breathes the oxygen. The cow gives back CO₂ and water for the grass.", "hook": "Each one hands the other what it needs.", "recall": {"q": "What does the cow give back to the grass?", "a": "CO₂ and water."}}, {"head": "Side by side", "body": "The comparison chart from your packet, filled in.", "visual": {"type": "table", "head": ["", "Photosynthesis", "Cellular respiration"], "rows": [["Equation", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy"], ["Endo or exo", "Endothermic", "Exothermic"], ["Reactants", "CO₂, H₂O", "C₆H₁₂O₆, O₂"], ["Products", "C₆H₁₂O₆, O₂", "CO₂, H₂O"], ["Where", "Chloroplast", "Mitochondria"], ["Step 1", "Light-dependent reaction · grana (thylakoid membrane) · uses sunlight and water · makes ATP, NADPH (and O₂)", "Krebs (citric acid) cycle · matrix · uses pyruvate · makes CO₂, 2 ATP, NADH, FADH₂"], ["Step 2", "Calvin cycle (light-independent) · stroma · uses CO₂, ATP, NADPH · makes glucose", "Electron transport chain · inner membrane · uses hydrogens and O₂ · makes 34 ATP and H₂O"]]}, "recall": {"q": "On the comparison chart, what's Step 1 of each process?", "a": "Photosynthesis: the light-dependent reaction. Cellular respiration: the Krebs (citric acid) cycle. Glycolysis comes before Step 1, in the cytoplasm."}}, {"head": "Both have an electron transport chain", "body": "In photosynthesis, an ETC is part of step 1, but that step's name is the light-dependent reaction. In respiration, the ETC is step 2 and makes 34 ATP.", "hook": "Photosynthesis step 1 = light-dependent reaction. Respiration step 2 = ETC.", "recall": {"q": "What's the name of photosynthesis step 1?", "a": "The light-dependent reaction (not the electron transport chain)."}}, {"head": "Plants do both", "body": "Plants make glucose by photosynthesis, then break it down by cellular respiration for ATP. Animals do only cellular respiration.", "hook": "Every living cell needs ATP.", "recall": {"q": "Do plants do cellular respiration?", "a": "Yes. Plants do both. Animals do only cellular respiration."}}], "check": [{"q": "Which process is endothermic?", "a": "Photosynthesis (it takes in light energy)."}, {"q": "What are the products of cellular respiration?", "a": "CO₂ and H₂O (and energy as ATP, which isn't counted as a product)."}]}], "flashcards": [{"id": "f1-
